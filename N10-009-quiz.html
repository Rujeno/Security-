<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار محاكي — N10-009 · الوحدة 1 إلى 4</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1b25;--paper:#f7f9fa;--deep:#0d3b4f;--teal:#12617c;--signal:#e8672c;--line:#d8e2e7;--muted:#5b7280;--soft:#eef4f6;--good:#1a7f5c;--bad:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--paper);color:var(--ink);line-height:1.85;font-size:16.5px}
.en{font-family:'IBM Plex Mono',monospace;direction:ltr;unicode-bidi:embed;font-size:.93em}
header{background:linear-gradient(135deg,var(--deep),#0a2a3a);color:#fff;padding:34px 20px;text-align:center}
header h1{font-size:clamp(21px,3.4vw,30px)}
header p{color:#b9d2dd;font-size:14.5px;margin-top:6px}
.crosslink{text-align:center;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.crosslink a{color:var(--teal);font-weight:700;text-decoration:none;font-size:15px}
.crosslink a:hover{text-decoration:underline}
.wrap{max-width:820px;margin:0 auto;padding:26px 18px 70px}

/* module filter */
.modbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.modbtn{font-family:inherit;font-size:13.5px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:7px 16px;cursor:pointer;transition:.15s}
.modbtn:hover{border-color:var(--teal)}
.modbtn.active{background:var(--deep);border-color:var(--deep);color:#fff}

/* progress */
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:var(--muted);font-weight:600}
.bar{height:8px;background:#e2eaee;border-radius:99px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--signal));transition:width .35s}

.qcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 26px 22px;box-shadow:0 2px 8px rgba(13,59,79,.06)}
.qtag{display:inline-block;font-size:12px;font-weight:700;color:var(--teal);background:var(--soft);border-radius:99px;padding:3px 12px;margin-bottom:12px}
.qtext{font-size:18px;font-weight:700;color:var(--deep);margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;background:#fff;text-align:right;font-family:inherit;font-size:16px;line-height:1.7;transition:.15s;width:100%}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--soft)}
.opt.correct{border-color:var(--good);background:#e9f6f0;font-weight:600}
.opt.wrong{border-color:var(--bad);background:#fdeeec}
.opt:disabled{cursor:default;opacity:.92}

.explain{display:none;margin-top:16px;border-radius:12px;padding:14px 18px;font-size:15px;background:#fff7f1;border:1px solid #f3c9ab}
.explain.show{display:block}
.explain b{color:var(--signal)}
.verdict{display:none;font-weight:700;margin-top:14px;font-size:15.5px}
.verdict.ok{display:block;color:var(--good)}
.verdict.no{display:block;color:var(--bad)}

.controls{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
button.nav{font-family:inherit;font-weight:700;font-size:15px;border:none;border-radius:12px;padding:11px 26px;cursor:pointer}
#nextBtn{background:var(--deep);color:#fff}
#nextBtn:disabled{background:#c3d2da;cursor:not-allowed}

/* result */
#result{display:none;text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:44px 28px}
.score-ring{width:150px;height:150px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:var(--deep);background:conic-gradient(var(--good) calc(var(--p)*1%), #e2eaee 0)}
.score-ring span{background:#fff;width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center}
#result h2{color:var(--deep);margin-bottom:8px}
#result p{color:var(--muted);margin-bottom:6px}
#result .msg{font-weight:700;font-size:18px;margin:10px 0 20px}
#restart{background:var(--signal);color:#fff}
.review{margin-top:26px;text-align:right}
.review h3{color:var(--teal);margin-bottom:12px}
.rv{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;font-size:14.5px;background:#fff}
.rv.miss{border-right:4px solid var(--bad)}
.rv.hit{border-right:4px solid var(--good)}
@media(max-width:560px){.qcard{padding:20px 16px}}
</style>
</head>

<header>
 <h1>اختبار محاكي · CompTIA Network+ N10-009</h1>
 <p>الوحدة 1 (Fundamentals) · الوحدة 2 (Cabling) · الوحدة 3 (Interfaces & Switches) · الوحدة 4 (Network Addressing) — 77 سؤالًا بنمط الاختبار الفعلي</p>
</header>

<div class="wrap">
 <div id="quizArea">
  <div class="meta"><span id="counter"></span><span id="scoreLive"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="qcard">
   <span class="qtag" id="qtag"></span>
   <div class="qtext" id="qtext"></div>
   <div class="opts" id="opts"></div>
   <div class="verdict" id="verdict"></div>
   <div class="explain" id="explain"></div>
   <div class="controls">
    <span></span>
    <button class="nav" id="nextBtn" disabled>السؤال التالي ←</button>
   </div>
  </div>
 </div>

 <div id="result">
  <div class="score-ring" id="ring"><span id="scoreTxt"></span></div>
  <h2>انتهى الاختبار!</h2>
  <p id="finalLine"></p>
  <p class="msg" id="msg"></p>
  <button class="nav" id="restart" onclick="location.reload()">إعادة الاختبار ⟳</button>
  <div class="review" id="reviewBox"></div>
 </div>
</div>

<script>
const Q = [
// ---------- Module 1 ----------
{t:"M1 · Network Types", q:"شركة صغيرة تريد أن يقدّم جهاز مركزي واحد الملفات وخدمات المصادقة لجميع أجهزة الموظفين. أي نموذج شبكة يصف هذا؟",
 o:["Peer-to-Peer","Client-Server","Mesh network","Ad-hoc network"], a:1,
 e:"وجود <b>server مركزي</b> يقدّم الموارد والخدمات للأجهزة (clients) هو تعريف نموذج <b>Client-Server</b>. أما P2P فكل جهاز يعمل client وserver معًا بدون جهاز مركزي."},

{t:"M1 · LAN Types", q:"ما التعريف الصحيح للـ LAN (Local Area Network)؟",
 o:["شبكة تمتد بين عدة مدن","شبكة محصورة في موقع جغرافي واحد","شبكة تربط مزودي الخدمة ببعض","شبكة لاسلكية فقط"], a:1,
 e:"الـ<b>LAN</b> محصورة في <b>single geographical location</b> — سواء كانت SOHO أو Enterprise LAN أو Datacenter."},

{t:"M1 · Topologies", q:"في شبكة point-to-point، الجهاز لا يستطيع الإرسال والاستقبال في نفس الوقت. ماذا نسمي هذا الوضع؟",
 o:["Full-duplex","Simplex","Half-duplex","Multiplex"], a:2,
 e:"<b>Half-duplex</b> = إرسال أو استقبال بالتناوب وليس معًا. <b>Full-duplex</b> = الاثنان في نفس اللحظة."},

{t:"M1 · Topologies", q:"أي عبارة صحيحة عن الـ Star Topology؟",
 o:["كل عقدة متصلة بكل العقد الأخرى مباشرة","الـconcentrator يمثل single point of failure","لا تحتاج أي جهاز مركزي","عدد الروابط فيها n*(n−1)/2"], a:1,
 e:"في Star كل عقدة تتصل بجهاز مركزي (<b>concentrator</b>)، وإذا تعطل تسقط الشبكة كلها = <b>single point of failure</b>. معادلة n*(n−1)/2 تخص <b>full mesh</b>."},

{t:"M1 · Topologies", q:"شركة تحتاج شبكة تستمر بالعمل حتى لو فشلت بعض الروابط، بحيث تسلك الحزم مسارات بديلة. أي topology تختار؟",
 o:["Star","Point-to-Point","Bus","Mesh"], a:3,
 e:"<b>Mesh</b> توفر مسارات متعددة (multiple routes) = <b>resilience</b> عند فشل العقد أو الروابط. الـpartial mesh هو الشائع عمليًا لصعوبة توفير روابط الـfull mesh."},

{t:"M1 · Topologies", q:"كم عدد الروابط المطلوبة لشبكة full mesh مكوّنة من 6 عقد؟",
 o:["6","12","15","30"], a:2,
 e:"المعادلة: n*(n−1)/2 → 6×5÷2 = <b>15</b> رابطًا."},

{t:"M1 · OSI", q:"ما الترتيب الصحيح لطبقات OSI من الطبقة 1 إلى 7؟",
 o:["Physical, Data Link, Network, Transport, Session, Presentation, Application",
    "Application, Presentation, Session, Transport, Network, Data Link, Physical",
    "Physical, Network, Data Link, Session, Transport, Presentation, Application",
    "Data Link, Physical, Network, Transport, Presentation, Session, Application"], a:0,
 e:"من 1→7: <b>P</b>hysical, <b>D</b>ata Link, <b>N</b>etwork, <b>T</b>ransport, <b>S</b>ession, <b>P</b>resentation, <b>A</b>pplication — تذكري: <b>Please Do Not Throw Sausage Pizza Away</b>."},

{t:"M1 · OSI", q:"سويتش (Switch) يوجّه الـframes باستخدام عناوين MAC. في أي طبقة OSI يعمل؟",
 o:["Layer 1 – Physical","Layer 2 – Data Link","Layer 3 – Network","Layer 4 – Transport"], a:1,
 e:"<b>Data Link (L2)</b>: نقل البيانات بين العقد على نفس الـsegment باستخدام <b>hardware/MAC addresses</b>، وأجهزتها: Switch, Bridge, NIC, Wireless AP."},

{t:"M1 · OSI", q:"أي طبقة مسؤولة عن إعطاء الحزم عنوان IP وجهة وتمريرها إلى الشبكة المقصودة؟",
 o:["Data Link","Transport","Network","Session"], a:2,
 e:"<b>Network (L3)</b>: نقل البيانات عبر شبكة من الشبكات باستخدام network & host IDs، وأجهزتها: <b>Router, ACL, Basic Firewall</b>."},

{t:"M1 · OSI", q:"التشفير وفك التشفير (Encryption/Decryption) وMIME من وظائف أي طبقة؟",
 o:["Application","Presentation","Session","Transport"], a:1,
 e:"<b>Presentation (L6)</b>: تجهيز شكل البيانات — encryption, encoding, compression, وMIME."},

{t:"M1 · OSI", q:"تقسيم البيانات إلى segments وإعادة تجميعها وتتبع الاتصال بين التطبيقات عبر أرقام الـports — أي طبقة؟",
 o:["Network","Session","Transport","Data Link"], a:2,
 e:"<b>Transport (L4)</b>: segmentation وreassembly وتتبّع الاتصالات بين التطبيقات عبر <b>port numbers</b> (مثل 80 للويب و25 للبريد)."},

{t:"M1 · OSI", q:"بروتوكولات SMTP و DNS و FTP أمثلة على أي طبقة؟",
 o:["Layer 7 – Application","Layer 6 – Presentation","Layer 5 – Session","Layer 4 – Transport"], a:0,
 e:"<b>Application (L7)</b> تتفاعل مباشرة مع برامج المستخدم لطلب خدمات الشبكة — أمثلتها: <b>SMTP, DNS, FTP</b>."},

{t:"M1 · OSI", q:"أي الطبقات تُعتبر \"Responsibility of the Network\" وليست مسؤولية الـHost؟",
 o:["الطبقات 4 إلى 7","الطبقات 1 إلى 3","الطبقات 5 إلى 7","الطبقة 4 فقط"], a:1,
 e:"الطبقات <b>1–3</b> (Physical, Data Link, Network) مسؤولية الشبكة، والطبقات <b>4–7</b> مسؤولية الـHost."},

{t:"M1 · SOHO", q:"أي خدمة يشغّلها الـSOHO Router في طبقة Network لتزويد كل جهاز محلي بعنوان IP تلقائيًا؟",
 o:["DNS","NAT فقط","DHCP server","ARP"], a:2,
 e:"الراوتر يشغّل <b>DHCP server</b> ليمنح كل host عنوان IP، بينما واجهة الـWAN تأخذ <b>public IP address</b> من المزود."},

{t:"M1 · SOHO", q:"في SOHO Router، منفذ الـWAN يُستخدم لـ:",
 o:["توصيل الطابعة المحلية","الاتصال بشبكة مزود خدمة الإنترنت (ISP)","توصيل أجهزة الـLAN سلكيًا","بث الواي فاي"], a:1,
 e:"<b>WAN port</b> = الاتصال بشبكة الـ<b>ISP</b>. منافذ RJ-45 LAN للأجهزة المحلية، والـantennas للواي فاي."},

{t:"M1 · Binary", q:"ما التمثيل الثنائي (Binary) للرقم 205؟",
 o:["11001101","10101101","11010011","11001011"], a:0,
 e:"205 = 128+64+8+4+1 → <b>1100 1101</b>. طريقة الحل: اطرحي أكبر قوة للـ2 ممكنة بالتتابع."},

{t:"M1 · Troubleshooting", q:"ما الخطوة الأولى في منهجية CompTIA لاستكشاف الأخطاء؟",
 o:["Establish a theory of probable cause","Identify the problem","Test the theory","Document findings"], a:1,
 e:"الترتيب: <b>Identify the problem</b> → Establish a theory → Test the theory → Establish a plan → Implement → Verify → Document."},

{t:"M1 · Troubleshooting", q:"فنّي حدّد المشكلة ووضع نظرية للسبب المحتمل واختبرها فتأكدت صحتها. ما الخطوة التالية؟",
 o:["Implement the solution","Document findings","Establish a plan of action","Verify full system functionality"], a:2,
 e:"بعد نجاح اختبار النظرية تأتي خطوة <b>Establish a plan of action</b> ثم التنفيذ (Implement) ثم التحقق (Verify) ثم التوثيق."},

{t:"M1 · Troubleshooting", q:"متى يكون التصعيد (Escalation) قرارًا صحيحًا؟ (اختاري الأدق)",
 o:["عند أول فشل لأي حل","إذا كانت المشكلة تحت ضمان النظام أو تتجاوز معرفتك وصلاحيتك","فقط عندما يطلب العميل ذلك","لا يُصعَّد أبدًا قبل التوثيق"], a:1,
 e:"مبررات التصعيد: المشكلة <b>تتجاوز معرفتك/قدرتك</b>، تقع تحت <b>system warranty</b>، نطاقها كبير جدًا، أو العميل صعب/مسيء."},

{t:"M1 · Troubleshooting", q:"فنّي يبدأ فحصه دائمًا من الكيبل والطاقة ثم يصعد للطبقات الأعلى. أي أسلوب يستخدم؟",
 o:["Top-down","Divide-and-conquer","Bottom-up","Random substitution"], a:2,
 e:"<b>Bottom-up</b> = البدء من Physical صعودًا. <b>Top-down</b> يبدأ من Application نزولًا، و<b>divide-and-conquer</b> يبدأ من طبقة وسطى."},

// ---------- Module 2 ----------
{t:"M2 · Ethernet", q:"معايير IEEE 802.3 تُعرّف أي طبقات لعمل الإيثرنت السلكي؟",
 o:["Network و Transport","Physical و MAC (Data Link)","Session و Presentation","Application فقط"], a:1,
 e:"<b>IEEE 802.3</b> يعرّف الـ<b>Physical layer</b> وآلية <b>MAC (Media Access Control)</b> في طبقة Data Link للإيثرنت السلكي."},

{t:"M2 · Ethernet", q:"ما الحد الأدنى من فئة الكيبل لتشغيل 1000Base-T (Gigabit Ethernet) وفق الجدول المعياري؟",
 o:["Cat5","Cat5e","Cat6","Cat7"], a:2,
 e:"حسب جدول المعايير: <b>1000Base-T و10GBase-T يتطلبان Cat6 أو أعلى</b>، بينما 100Base-T يكتفي بـCat5e."},

{t:"M2 · CSMA/CD", q:"في CSMA/CD، ماذا يحدث مباشرة بعد اكتشاف التصادم (collision)؟",
 o:["يُعاد الإرسال فورًا بدون انتظار","تُرسل Jam signal ثم ينتظر الجهاز وفق Backoff algorithm","يُغلق المنفذ نهائيًا","يتحول الوسيط إلى full-duplex"], a:1,
 e:"الحل عند التصادم: <b>Jam signal</b> لإعلام الجميع، ثم انتظار عشوائي عبر <b>Backoff algorithm</b> قبل إعادة الإرسال."},

{t:"M2 · Copper", q:"بيئة صناعية فيها آلات تسبب تداخلًا كهرومغناطيسيًا (EMI) كبيرًا، والمطلوب كيبل نحاسي عالي السرعة لمسافات لا تتجاوز 100م. ما الخيار الأنسب؟",
 o:["UTP","STP","Coaxial","RJ11 cabling"], a:1,
 e:"<b>STP (Shielded Twisted Pair)</b> يوفر تدريعًا موصلًا يحمي من <b>EMI</b> ويقلل crosstalk — الخيار النحاسي الصحيح للبيئات عالية التداخل."},

{t:"M2 · Copper", q:"أي عبارة تصف موصل RJ45 بشكل صحيح؟",
 o:["6 positions / 4 connectors ويُستخدم للهاتف","8 positions / 8 connectors ويُستخدم لشبكات الحاسب","موصل ألياف بصرية بتصميم push-pull","يدعم 24 Mbps كحد أقصى"], a:1,
 e:"<b>RJ45</b>: 8 مواضع/8 موصلات، لشبكات الحاسب حتى 10 Gbps. أما <b>RJ11</b> (6P4C) فللهاتف والمودم بسرعة 24 Mbps."},

{t:"M2 · Copper", q:"تحتاجين تمديد كيبل داخل فراغ تدوير الهواء فوق السقف المستعار. أي تصنيف كيبل يجب استخدامه؟",
 o:["Riser-rated","Plenum-rated","Direct burial","Outdoor-rated"], a:1,
 e:"<b>Plenum-rated</b> مصنوع من مواد مقاومة للحريق منخفضة السمّية لفراغات الهواء (plenum spaces). أما <b>Riser</b> فللفراغات الرأسية بين الطوابق."},

{t:"M2 · Structured Cabling", q:"في نظام الـStructured Cabling، ما اسم التمديد الرأسي الذي يربط الطوابق وغرف الاتصالات ببعضها؟",
 o:["Horizontal cabling","Work area cabling","Backbone cabling","Demarc extension"], a:2,
 e:"<b>Backbone cabling</b> = الروابط الرأسية بين الطوابق/الغرف. <b>Horizontal cabling</b> على مستوى الطابق الواحد، و<b>Entrance facilities/Demarc</b> نقطة دخول خدمة المزود."},

{t:"M2 · Fiber", q:"مطلوب ربط موقعين على مسافة طويلة جدًا بألياف بصرية بأقل توهين. أي نوع تختارين؟",
 o:["Multimode fiber (MMF)","Single mode fiber (SMF)","Coaxial","Twinaxial"], a:1,
 e:"<b>SMF</b>: قلب صغير ونمط ضوء واحد → انعكاس وتوهين أقل → مثالي <b>للمسافات الطويلة</b>. الـMMF أنسب للمسافات القصيرة (Datacenters/LANs)."},

{t:"M2 · Fiber", q:"أي موصل ألياف يتميز بحجم ferrule يبلغ 1.25mm ويُفضَّل للـpatch panels عالية الكثافة؟",
 o:["SC","ST","LC","RJ45"], a:2,
 e:"<b>LC (Lucent Connector)</b>: ferrule صغير <b>1.25mm</b> بتصميم duplex — مثالي للوحات المزدحمة. SC وST حجمهما 2.5mm."},

{t:"M2 · Cable Troubleshooting", q:"فنّية تحتاج تتبّع كيبل غير معنون يمر داخل الجدران وسط حزمة كيابل. أي أداة تستخدم؟",
 o:["Loopback tool","Tone generator and probe (Fox and Hound)","Crimp tool","Punch-down tool"], a:1,
 e:"<b>Tone generator + probe</b> (يُعرف بـ<b>Fox and Hound</b>): يضخ إشارة في الكيبل ويتتبعها المسبار عبر الجدران أو داخل الحزم. الـloopback لاختبار المنافذ/الـtransceivers."},

// ---------- Module 3 ----------
{t:"M3 · NIC", q:"بطاقة الشبكة (NIC) هي مكوّن transceiver يربط الجهاز بوسيط النقل، ولها عنوان MAC فريد. في أي طبقة من OSI تعمل؟",
 o:["Layer 1 – Physical","Layer 2 – Data Link","Layer 3 – Network","Layer 4 – Transport"], a:1,
 e:"<b>NIC</b> يعمل في <b>Data Link (L2)</b> لأنه يُعرَّف بعنوان <b>MAC address</b> فريد، وقد يحتوي على أكثر من منفذ على نفس البطاقة."},

{t:"M3 · Transceivers", q:"ما الوظيفة الأساسية للـmodular transceiver؟",
 o:["توليد عنوان IP للجهاز","إنهاء أنواع مختلفة من الكيابل والموصلات، ويعمل في Data Link","تشفير البيانات قبل الإرسال","توجيه الحزم بين الشبكات المختلفة"], a:1,
 e:"الـ<b>modular transceivers</b> تسمح بإنهاء أنواع متعددة من الكيابل/الموصلات على نفس المنفذ، وتعمل في طبقة <b>Data Link</b> مثل الـNIC."},

{t:"M3 · Transceivers", q:"فنّية تلاحظ فقدان حزم (packet loss) وأداءً ضعيفًا للشبكة، لكن الرابط لا ينقطع كليًا. ما السبب الأرجح؟",
 o:["Mismatched port type (no link)","مشكلة في قوة الإشارة (signal strength)","تعطيل المنفذ إداريًا","حظر المنفذ بواسطة STP"], a:1,
 e:"أعراض <b>signal strength</b>: اتصالات متقطعة، <b>packet loss</b>، وأداء ضعيف. بينما mismatched ports تُسبب انعدام الرابط (no link) بشكل واضح وليس تدهورًا تدريجيًا."},

{t:"M3 · MAC Address", q:"عنوان MAC المكوّن من 48-bit يتكون من جزأين رئيسيين هما؟",
 o:["Network ID و Host ID","OUI (Organizationally Unique Identifier) و Device ID","IP Address و Port Number","Preamble و SFD"], a:1,
 e:"عنوان MAC = <b>OUI</b> (يحدد الشركة المصنّعة) + <b>Device ID</b> (بناءً على موديل الجهاز وتاريخ التصنيع) — 48 bit، أزواج hex مفصولة بنقطتين أو شرطات."},

{t:"M3 · Ethernet Frame", q:"أي حقل في إطار الإيثرنت يحتوي على الكود المستخدم للتحقق من وجود أخطاء نقل؟",
 o:["Preamble","SFD","Ether Type","FCS (Frame Check Sequence)"], a:3,
 e:"<b>FCS</b> هو الحقل الأخير في الإطار ويحمل <b>error-checking code</b>. أما Preamble/SFD فللمزامنة وبداية الإطار، وEther Type يحدد بروتوكول الـpayload."},

{t:"M3 · MAC Address", q:"عنوان MAC الخاص بالـbroadcast (الذي يجعل كل الأجهزة على الشبكة تستقبل الإطار وتعالجه) يتكون من؟",
 o:["كل البتات صفر (00:00:00:00:00:00)","كل البتات واحد (FF:FF:FF:FF:FF:FF)","عنوان الـOUI فقط","نفس عنوان المرسل"], a:1,
 e:"إذا كان عنوان MAC كله بتات <b>1</b> (يظهر كـ FF:FF:FF:FF:FF:FF) فهو عنوان <b>broadcast</b>، وكل الأجهزة على الشبكة تستقبل الإطار وتعالجه."},

{t:"M3 · Hub vs Switch", q:"ما الفرق الجوهري بين الـHub والـSwitch في إرسال البيانات؟",
 o:["Hub يرسل من منفذ واحد فقط لمنفذ الوجهة، وSwitch يرسل لكل المنافذ","Switch يرسل من منفذ واحد فقط لمنفذ الوجهة، وHub يرسل لكل منفذ آخر","كلاهما يرسل لكل المنافذ بنفس الطريقة","كلاهما يرسل لمنفذ الوجهة فقط"], a:1,
 e:"<b>Hub</b> يبث الإرسال لكل منفذ آخر (يعمل بالـPhysical layer فقط). <b>Switch</b> يتعلم عناوين MAC ويرسل الإطار لمنفذ الوجهة المحدد فقط، ما يقلل الازدحام."},

{t:"M3 · Bridge", q:"ما وظيفة الـBridge في الشبكة؟",
 o:["تضخيم الإشارة الكهربائية فقط","فصل segments فيزيائية مع إبقاء كل العقد ضمن نفس الشبكة المنطقية","توزيع عناوين IP تلقائيًا","تشفير حركة المرور بين الشبكات"], a:1,
 e:"الـ<b>Bridge</b> يفصل الشبكة إلى <b>physical segments</b> منفصلة بينما يحافظ على أن جميع العُقد جزء من نفس <b>logical network</b>."},

{t:"M3 · Switch Types", q:"ما الفرق الجوهري بين الـmanaged switch والـunmanaged switch؟",
 o:["الـmanaged يمكن إعداده وتخصيصه، والـunmanaged بلا خيارات إعداد","العكس تمامًا","كلاهما نفس الوظيفة بأسماء مختلفة","الفرق فقط في عدد المنافذ"], a:0,
 e:"<b>Managed switches</b> يمكن ضبط إعداداتها (VLANs, STP...)، بينما <b>Unmanaged switches</b> لا تملك أي خيارات إعداد — توصيل وتشغيل فقط."},

{t:"M3 · Switch Types", q:"ما الفرق بين الـModular switch والـFixed switch؟",
 o:["Modular له عدد ثابت من المنافذ، Fixed يقبل أنواع/أعداد مختلفة من الوحدات","Modular يمكن تجهيزه بأعداد وأنواع مختلفة من المنافذ، Fixed يأتي بعدد منافذ ثابت","كلاهما نفس الشيء","Fixed فقط للاستخدام المنزلي"], a:1,
 e:"<b>Modular switches</b> تُهيَّأ بأعداد وأنواع منافذ مختلفة حسب الحاجة، بينما <b>Fixed switches</b> تأتي بعدد منافذ ثابت مسبقًا."},

{t:"M3 · Link Aggregation", q:"دمج رابطين أو أكثر من الكيبلات المنفصلة في قناة منطقية واحدة لتوفير تكرار (redundancy) وكفاءة بالتكلفة يُسمى؟",
 o:["Spanning Tree Protocol","Link Aggregation / NIC Teaming","Power over Ethernet","Jumbo Framing"], a:1,
 e:"<b>Link Aggregation (NIC Teaming)</b>: دمج رابطين+ في قناة منطقية واحدة → <b>redundancy</b> و<b>cost effective</b>."},

{t:"M3 · MTU", q:"ما الحد الأقصى القياسي (Maximum Transmission Unit) لإطار الإيثرنت العادي، مقارنة بالـJumbo frame؟",
 o:["1500 bytes عادي مقابل حتى 9216 bytes للـJumbo frame","9216 bytes عادي مقابل 1500 bytes للـJumbo","64 bytes عادي فقط","لا يوجد حد أقصى محدد"], a:0,
 e:"الإطار العادي MTU = <b>1500 bytes</b>. الـ<b>Jumbo frame</b> يدعم حمولة حتى <b>9216 bytes</b> لتقليل عدد الإطارات المرسلة، لكنه يخالف معايير الإيثرنت القياسية."},

{t:"M3 · STP", q:"ما الوظيفة الأساسية لبروتوكول Spanning Tree Protocol (STP)؟",
 o:["تسريع نقل البيانات بين السويتشات","منع حلقات الجسر (bridge loops) وتوفير تحمّل الأعطال (fault tolerance)","تشفير حركة المرور","توزيع عناوين IP على الأجهزة"], a:1,
 e:"<b>STP</b> بروتوكول طبقة <b>Data Link (L2)</b> يمنع <b>bridge loops</b> ويوفر <b>fault tolerance</b> عبر حظر الروابط الزائدة منطقيًا."},

{t:"M3 · PoE", q:"ما الفائدة الرئيسية لتقنية Power over Ethernet (PoE)؟",
 o:["نقل البيانات فقط بسرعة أعلى","نقل البيانات والطاقة الكهربائية عبر كيبل واحد لتبسيط التركيب","تشفير الاتصال بين الأجهزة","زيادة المسافة القصوى للكيبل النحاسي"], a:1,
 e:"<b>PoE</b> يسمح لكيبل واحد بنقل <b>data</b> و<b>power</b> معًا للأجهزة المتصلة (مثل كاميرات وAPs)، ما يبسّط التركيب والتوسع."},

{t:"M3 · Port Indicators", q:"مؤشر منفذ السويتش يضيء بلون كهرماني ثابت (solid amber). ماذا يعني هذا عادة؟",
 o:["الرابط متصل بدون ترافيك","المنفذ محظور بواسطة خوارزمية Spanning Tree","تم اكتشاف عطل بالمنفذ","الرابط لا يعمل إطلاقًا"], a:1,
 e:"<b>Solid amber</b> = المنفذ <b>blocked by the spanning tree algorithm</b>. أما blinking amber فيعني fault detected، وsolid green يعني connected بدون traffic."},

{t:"M3 · Port Indicators", q:"المؤشر الكهرماني الوامض (blinking amber) على منفذ السويتش يدل على؟",
 o:["رابط طبيعي بترافيك عادي","تم اكتشاف عطل (a fault has been detected)","المنفذ محظور بواسطة STP فقط","لا يوجد اتصال بالمرة"], a:1,
 e:"<b>Blinking amber</b> تعني وجود <b>fault</b> تم اكتشافه على ذلك المنفذ ويستحق الفحص الفوري."},

{t:"M3 · Show Commands", q:"أي أمر على السويتش يعرض الإعداد الذي سيُستخدم عند إعادة تشغيل الجهاز في المرة القادمة؟",
 o:["show running-config","show startup-config","show interface","show version"], a:1,
 e:"<b>show startup-config</b> = الإعداد الذي سيُطبَّق عند <b>next restart</b>. أما <b>show running-config</b> فهو الإعداد <b>النشط حاليًا</b>."},

{t:"M3 · Interface Status", q:"حالة منفذ سويتش تظهر كـ\"Administratively down/down\" تعني؟",
 o:["عطل تلقائي بسبب خطأ بالشبكة أو مخالفة سياسة","تعطيل يدوي من المسؤول عبر أمر shutdown","الطبقة الفيزيائية تعمل لكن Data Link معطلة تلقائيًا","الكيبل غير موصول فعليًا فقط"], a:1,
 e:"<b>Administratively down/down</b> = تم تعطيل الواجهة يدويًا من المسؤول باستخدام أمر <b>shutdown</b>. أما \"Down/error disabled\" فهو تعطيل تلقائي بسبب خطأ أو مخالفة سياسة."},

{t:"M3 · Interface Errors", q:"خطأ CRC (Cyclic Redundancy Check) على واجهة الشبكة يشير غالبًا إلى؟",
 o:["ضجيج أو تداخل أو عطل بالمعدات (checksum المحسوب لا يطابق المرسَل)","تصادمات فقط بين الأجهزة","تجاوز الإطار للحجم الأقصى المسموح","سوء إعداد VLAN فقط"], a:0,
 e:"خطأ <b>CRC</b> يعني أن checksum المحسوب للإطار لا يطابق المرسَل — مؤشر على <b>noise, interference, or equipment malfunction</b>."},

{t:"M3 · Network Loops", q:"شبكة تعاني من حلقات (network loops) بسبب اتصالات زائدة (redundant connections). ما الحل القياسي الموصى به؟",
 o:["زيادة نطاقات البث (broadcast domains)","تفعيل Spanning Tree Protocol (STP) وضبط الاتصالات الزائدة بشكل صحيح","زيادة MTU للإطارات","تعطيل PoE على كل المنافذ"], a:1,
 e:"حلول <b>network loops</b>: تهيئة صحيحة للاتصالات الزائدة، تفعيل <b>STP</b>، وتوعية المستخدمين. أما broadcast storms فحلها يكون بمراقبة DHCP وتقسيم (segment) الشبكة."},

// ---------- Module 4 ----------
{t:"M4 · ARP", q:"ما وظيفة بروتوكول ARP (Address Resolution Protocol)؟",
 o:["ترجمة اسم النطاق (domain name) إلى IP","ربط عنوان IP بعنوان MAC المقابل له على الشبكة المحلية","توزيع عناوين IP تلقائيًا على الأجهزة","تشفير الاتصال بين المضيفين"], a:1,
 e:"<b>ARP</b> يعمل مثل دليل هاتف: يربط عنوان <b>IP</b> بعنوان <b>MAC</b> المقابل له ليتم توجيه الإطار بشكل صحيح على الشبكة المحلية."},

{t:"M4 · Addressing Types", q:"عنوان Anycast يُرسل البيانات إلى؟",
 o:["كل المضيفين على الشبكة أو الـsubnet","أقرب جهاز من مجموعة أجهزة تحمل نفس العنوان (لموازنة الحمل والتكرار)","مضيف واحد محدد سلفًا فقط بدون بدائل","مجموعة محددة من المضيفين فقط"], a:1,
 e:"<b>Anycast</b>: عنوان واحد لمجموعة أجهزة، وتُرسل البيانات إلى <b>أقرب جهاز</b> منها — يُستخدم لـ<b>load balancing</b> و<b>redundancy</b>."},

{t:"M4 · Addressing Types", q:"عنوان Broadcast في IPv4 (المُوجَّه للعنوان الأخير في الشبكة أو الـsubnet) يُرسل البيانات إلى؟",
 o:["جهاز واحد محدد فقط (unicast)","كل المضيفين على تلك الشبكة أو الـsubnet","أقرب جهاز فقط","مجموعة معينة مُسجَّلة مسبقًا"], a:1,
 e:"<b>Broadcast</b> مُعنوَن لآخر IP في الشبكة/الـsubnet، ويصل إلى <b>جميع المضيفين</b> على تلك الشبكة أو الـsubnet."},

{t:"M4 · Addressing Types", q:"عنوان Multicast يوجّه البيانات إلى؟",
 o:["كل الأجهزة على الإنترنت بلا استثناء","مجموعة محددة من عناوين المضيفين المشتركين بذلك العنوان","جهاز واحد فقط دومًا","أقرب جهاز جغرافيًا فقط"], a:1,
 e:"<b>Multicast</b> مُعنوَن لـ<b>مجموعة محددة</b> من عناوين المضيفين، وتصل البيانات لكل الأعضاء المشتركين في تلك المجموعة على الشبكة أو الـsubnet."},

{t:"M4 · Binary", q:"حوّلي الثنائي 11000011 إلى الصيغة العشرية (Base 10).",
 o:["194","97","131","201"], a:1,
 e:"بالأوزان 128-64-32-16-8-4-2-1: البتات المفعّلة هي 64+32+1 = <b>97</b>."},

{t:"M4 · IPv4 Structure", q:"عنوان IPv4 يتكون من كم bit إجمالًا، وكيف يُقسم؟",
 o:["48 bit مقسمة إلى 6 أجزاء","32 bit مقسمة إلى أربعة octets، كل واحد 8 bits","64 bit مقسمة إلى 4 أجزاء من 16 bit","16 bit فقط بدون تقسيم"], a:1,
 e:"عنوان <b>IPv4</b> = تمثيل عشري لأربع مجموعات ثنائية (<b>octets</b>)، كل octet <b>8 bits</b> → المجموع <b>32 bit</b>."},

{t:"M4 · IP Formatting", q:"في تشبيه العمارة السكنية لعنونة IP، ماذا يمثّل الـNetwork ID؟",
 o:["رقم الشقة داخل المبنى","رقم/عنوان المبنى (العمارة) نفسه، وهو مشترك بين كل السكان","اسم الساكن فقط","الطابق الذي تقع فيه الشقة"], a:1,
 e:"<b>Network ID</b> يشبه رقم <b>المبنى</b> — مشترك بين كل المضيفين على نفس الشبكة، بينما <b>Host ID</b> يشبه رقم <b>الشقة</b> ويحدد مضيفًا بعينه داخل تلك الشبكة."},

{t:"M4 · Subnet Mask", q:"ما وظيفة الـSubnet Mask؟",
 o:["تشفير عنوان IP قبل الإرسال","تحديد الجزء الخاص بالشبكة من عنوان IP، لمعرفة إن كانت الحزمة تُرسل مباشرة أو تُمرَّر (forwarded)","توليد عناوين MAC تلقائيًا","حجب حزم البيانات غير المرغوبة"], a:1,
 e:"الـ<b>Subnet Mask</b> يحدد <b>network portion</b> من عنوان IP. إذا طابق الـnetwork ID الشبكةَ المحلية تُرسل الحزمة مباشرة، وإلا تُمرَّر (<b>forwarded</b>) لشبكة أخرى."},

{t:"M4 · Default Gateway", q:"في تشبيه العمارة، الـDefault Gateway يمثّل؟",
 o:["رقم الشقة الخاص بالمستخدم","المدخل الرئيسي (اللوبي) للمبنى الذي يخرج منه الجميع للخارج","صندوق البريد الشخصي","نظام الإنذار الداخلي"], a:1,
 e:"الـ<b>Default Gateway</b> يشبه <b>المدخل الرئيسي</b> للمبنى — الطريق الذي يمر عبره أي اتصال خارج الشبكة المحلية."},

{t:"M4 · Private Ranges", q:"أي مدى IP يمثّل نطاق Class A الخاص (Private)؟",
 o:["172.16.0.0 – 172.31.255.255","10.0.0.0 – 10.255.255.255","192.168.0.0 – 192.168.255.255","224.0.0.0 – 239.255.255.255"], a:1,
 e:"نطاقات الـprivate: <b>Class A: 10.0.0.0–10.255.255.255</b> · Class B: 172.16.0.0–172.31.255.255 · Class C: 192.168.0.0–192.168.255.255."},

{t:"M4 · Reserved Ranges", q:"المدى 224.0.0.0 – 239.255.255.255 (يُشار له أحيانًا كـ Class D) يُستخدم فعليًا كـ؟",
 o:["نطاق خاص إضافي (private) للشبكات المحلية","نطاق محجوز للـMulticast وليس للتخصيص كعناوين مضيفين عادية","نطاق public إضافي","نطاق broadcast حصريًا"], a:1,
 e:"⚠️ تنبيه دقيق: 224.0.0.0–239.255.255.255 ليس نطاقًا خاصًا فعليًا بل هو نطاق <b>Multicast</b> محجوز — يظهر أحيانًا في جداول مرجعية بجانب النطاقات الخاصة لكنه مختلف الغرض تمامًا."},

{t:"M4 · Scheme Design", q:"عند تصميم مخطط عنونة IPv4 خاص، أي قاعدة أساسية يجب مراعاتها؟",
 o:["يمكن أن يكون الـNetwork ID أو Host ID كله بتات 1 (فهذا لا يؤثر)","لا يجوز أن يكون الـNetwork ID أو الـHost ID كله بتات 1 (لأنه عنوان broadcast)، ويجب تفرّد كل Host ID داخل الـsubnet","لا داعي لتفرّد الـNetwork ID عبر الشبكة","يُسمح بتكرار نفس الـHost ID في أكثر من جهاز بنفس الـsubnet"], a:1,
 e:"قواعد التصميم: الـNetwork ID من مدى خاص صالح، لا يجوز أن يكون Network/Host ID <b>كله بتات 1</b> (broadcast)، وكل <b>Host ID</b> يجب أن يكون فريدًا داخل الـsubnet، وكل <b>Network ID</b> فريدًا على مستوى الشبكة."},

{t:"M4 · Classless Addressing", q:"عند استعارة (borrowing) بتات من جزء الـHost لصالح جزء الـNetwork، ماذا يحدث؟",
 o:["يزيد عدد الشبكات المتاحة، ويقلّ عدد المضيفين المتاحين بكل subnet","يقلّ عدد الشبكات، ويزيد عدد المضيفين","لا يتغيّر أي شيء في العنونة","تزيد سرعة نقل البيانات فقط"], a:0,
 e:"استعارة بتات الـHost لصالح الـNetwork (Classless addressing / VLSM) تزيد <b>عدد الشبكات الفرعية المتاحة</b> لكنها تقلّل <b>عدد المضيفين</b> الممكنين بكل subnet."},

{t:"M4 · Classless Example", q:"بافتراض الشبكة 192.168.89.0/24 (قناع 255.255.255.0) واستعارة بت واحد فقط من جزء الـHost، ما قناع الشبكة الجديد؟",
 o:["255.255.255.0 (/24) بدون تغيير","255.255.255.128 (/25)","255.255.255.192 (/26)","255.255.255.224 (/27)"], a:1,
 e:"استعارة بت واحد تنقل القناع من /24 إلى <b>/25 = 255.255.255.128</b>، وتنشئ شبكتين فرعيتين (مثال: 192.168.89.0/25 و192.168.89.128/25)."},

{t:"M4 · CIDR", q:"ما الذي يوفّره نظام CIDR (Classless Inter-Domain Routing)؟",
 o:["تخصيصًا أكثر كفاءة لمساحة عناوين IP، عبر دمج العنوان مع لاحقة تحدد جزء الشبكة، ودعم subnetting متغير الطول","تشفير حركة المرور بين الشبكات","حظر الوصول غير المصرح به تلقائيًا","تسريع استعلامات DNS"], a:0,

let idx=0, score=0, answers=[];
const $=id=>document.getElementById(id);

function render(){
 const q=Q[idx];
 $("qtag").textContent=q.t;
 $("qtext").innerHTML=q.q;
 $("counter").textContent=`السؤال ${idx+1} من ${Q.length}`;
 $("scoreLive").textContent=`النتيجة: ${score}`;
 $("prog").style.width=((idx)/Q.length*100)+"%";
 $("verdict").className="verdict"; $("explain").className="explain"; $("explain").innerHTML="";
 $("nextBtn").disabled=true;
 $("nextBtn").textContent = idx===Q.length-1 ? "عرض النتيجة 🏁" : "السؤال التالي ←";
 const box=$("opts"); box.innerHTML="";
 q.o.forEach((opt,i)=>{
  const b=document.createElement("button");
  b.className="opt"; b.innerHTML=opt;
  b.onclick=()=>choose(i,b);
  box.appendChild(b);
 });
}
function choose(i,btn){
 const q=Q[idx];
 [...$("opts").children].forEach((b,j)=>{b.disabled=true; if(j===q.a)b.classList.add("correct");});
 const ok = i===q.a;
 if(ok){score++;}else{btn.classList.add("wrong");}
 answers.push({q:q.q,ok,correct:q.o[q.a],tag:q.t});
 $("verdict").textContent = ok? "✓ إجابة صحيحة":"✗ إجابة خاطئة — الصحيح مظلل بالأخضر";
 $("verdict").className = "verdict "+(ok?"ok":"no");
 $("explain").innerHTML = "<b>الشرح:</b> "+q.e;
 $("explain").className="explain show";
 $("scoreLive").textContent=`النتيجة: ${score}`;
 $("nextBtn").disabled=false;
}
$("nextBtn").onclick=()=>{
 if(idx<Q.length-1){idx++; render(); window.scrollTo({top:0,behavior:"smooth"});}
 else finish();
};
function finish(){
 $("quizArea").style.display="none";
 const pct=Math.round(score/Q.length*100);
 $("ring").style.setProperty("--p",pct);
 $("scoreTxt").textContent=pct+"%";
 $("finalLine").textContent=`أجبتِ صحيحًا على ${score} من ${Q.length} سؤالًا`;
 const m=$("msg");
 if(pct>=90){m.textContent="ممتاز — مستوى جاهزية عالٍ لهذه الوحدات 👏"; m.style.color="var(--good)";}
 else if(pct>=75){m.textContent="جيد جدًا — راجعي الأسئلة الخاطئة أدناه وأعيدي المحاولة"; m.style.color="var(--teal)";}
 else if(pct>=60){m.textContent="على الحد — ركّزي على OSI وSubnetting وأنواع الكيابل ثم أعيدي الاختبار"; m.style.color="var(--signal)";}
 else{m.textContent="تحتاجين مراجعة ملخص الوحدات كاملة قبل إعادة المحاولة"; m.style.color="var(--bad)";}
 const rb=$("reviewBox");
 const misses=answers.filter(a=>!a.ok);
 rb.innerHTML = "<h3>مراجعة الأسئلة ("+misses.length+" خطأ)</h3>" + answers.map(a=>
   `<div class="rv ${a.ok?'hit':'miss'}"><b>${a.ok?'✓':'✗'} ${a.tag}</b><br>${a.q}<br><span style="color:var(--good)">الإجابة الصحيحة: ${a.correct}</span></div>`).join("");
 $("result").style.display="block";
 window.scrollTo({top:0,behavior:"smooth"});
}
render();
</script>
</body>
</html>
