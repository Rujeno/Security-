<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linux+ Quiz</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--d:#0d3b4f;--o:#e8672c;--l:#d8e2e7;--m:#5b7280}body{margin:0;background:#f7f9fa;font-family:'IBM Plex Sans Arabic',sans-serif;color:#10232d}.w{max-width:900px;margin:auto;padding:35px 20px}h1{color:var(--d)}.lessons{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.lessons a{padding:8px 11px;background:#fff;border:1px solid var(--l);border-radius:9px;text-decoration:none;color:var(--d);font-weight:700}.q{background:#fff;border:1px solid var(--l);border-radius:16px;padding:22px;margin:15px 0}.q h3{direction:ltr;text-align:left}.opt{display:block;width:100%;text-align:left;direction:ltr;background:#f8fafb;border:1px solid var(--l);padding:12px;margin:8px 0;border-radius:9px;cursor:pointer}.exp{display:none;background:#fff5ef;border-right:4px solid var(--o);padding:12px;margin-top:10px}.back{color:#12617c;text-decoration:none;font-weight:700}</style></head><body><main class="w"><a class="back" href="linux-index.html">← Linux+ الرئيسية</a><h1>📝 Linux+ XK0-005 — أسئلة الدروس</h1><p>اختاري رقم الدرس. الأسئلة بالإنجليزي والشرح بالعربي. صفحة الاختبار المحاكي الشامل مهيأة داخل نفس المسار.</p><div class="lessons" id="ls"></div><div id="box"></div></main><script>const Q={1:['Which command is the primary resource for Linux manual documentation?',['man','pwd','mkdir','ps'],0,'man pages هي المرجع الأساسي للتوثيق داخل Linux.'],2:['Which command is commonly used to create a local user account?',['useradd','chmod','grep','mount'],0,'useradd يُستخدم لإنشاء حساب مستخدم محلي.'],3:['Which command changes standard file permissions?',['chmod','chown','passwd','tar'],0,'chmod يغيّر صلاحيات القراءة والكتابة والتنفيذ.'],4:['Which command moves or renames a file?',['mv','ls','cat','pwd'],0,'mv يستخدم للنقل وكذلك لإعادة التسمية.'],5:['Which operator appends output to an existing text file?',['>>','>','|','<'],0,'>> يضيف المخرجات في نهاية الملف بدون استبدال محتواه الحالي.'],6:['Which tools can download files without a graphical browser?',['wget and curl','chmod and chown','ps and top','fdisk and mount'],0,'wget وcurl من أدوات الحصول على الملفات عبر الشبكة ويمكن استخدامهما في scripts.'],7:['Which command is useful for viewing block devices?',['lsblk','whoami','grep','echo'],0,'lsblk يعرض أجهزة التخزين block devices وبنيتها.'],8:['Which commands are commonly used to display running processes?',['ps and top','cp and mv','tar and gzip','ip and ping'],0,'ps وtop من أدوات مراقبة العمليات، وtop يعرض معلومات ديناميكية.'],9:['Which command manages systemd services?',['systemctl','useradd','fdisk','nano'],0,'systemctl يدير start/stop/status/enable لخدمات systemd.'],10:['Which command is the newer tool for IP address management?',['ip','ifconfig','cat','chmod'],0,'ip هو الأحدث مقارنةً بـifconfig لإدارة إعدادات الشبكة.'],11:['What is a primary goal of a host firewall?',['Control network traffic','Create users','Compile software','Edit text'],0,'الـfirewall يطبق قواعد للسماح أو منع حركة الشبكة.'],12:['Which frameworks provide context-based mandatory access controls on Linux?',['SELinux and AppArmor','Git and Docker','APT and RPM','SSH and DNS'],0,'SELinux وAppArmor يضيفان سياسات وصول تتجاوز صلاحيات Unix التقليدية.'],13:['Which shell is commonly used for Linux scripting in this course?',['Bash','SQL','HTML','CSS'],0,'Bash shell شائع لكتابة scripts وأتمتة المهام.'],14:['Which language is commonly used for Ansible playbooks?',['YAML','SQL','HTML','C'],0,'Ansible playbooks تُكتب عادةً بصيغة YAML.'],15:['Which command downloads an Nginx image from a Docker registry?',['docker pull nginx','docker attach nginx','docker commit nginx','docker rm nginx'],0,'docker pull يجلب image من registry إلى الجهاز المحلي.'],16:['Which is a common platform for installing Linux virtually?',['VirtualBox','Notepad','Excel','DNS'],0,'VirtualBox من خيارات virtualization المذكورة لتشغيل توزيعات Linux داخل VM.']};ls.innerHTML=Array.from({length:16},(_,i)=>`<a href="?lesson=${i+1}">${i+1}</a>`).join('')+'<a href="?mock=1">Mock Exam</a>';let n=+(new URLSearchParams(location.search).get('lesson')||0);let arr=n?[n]:Object.keys(Q).map(Number);box.innerHTML=arr.map(k=>{let q=Q[k];return `<div class="q"><small>Lesson ${k}</small><h3>${q[0]}</h3>${q[1].map((o,i)=>`<button class="opt" onclick="ans(this,${i===q[2]})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<div class="exp">${q[3]}</div></div>`}).join('');function ans(b,ok){let q=b.closest('.q');q.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.style.borderColor=ok?'#2f8f63':'#c94848';q.querySelector('.exp').style.display='block'}</script></body></html>
