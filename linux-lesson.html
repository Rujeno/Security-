<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linux+ Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--d:#0d3b4f;--o:#e8672c;--t:#12617c;--l:#d8e2e7;--m:#5b7280}*{box-sizing:border-box}body{margin:0;background:#f7f9fa;font-family:'IBM Plex Sans Arabic',sans-serif;color:#10232d}.hero{background:var(--d);color:#fff;padding:48px 22px;text-align:center}.hero small{font:13px monospace;color:#ffad84}.hero h1{font-size:clamp(28px,5vw,44px);margin:10px}.hero p{color:#c7dbe3}.nav{display:flex;gap:8px;overflow:auto;padding:12px 18px;background:#fff;border-bottom:1px solid var(--l);justify-content:center}.nav a{white-space:nowrap;color:var(--d);text-decoration:none;font-weight:700;padding:7px 9px;border-radius:8px}.nav a.active{background:var(--o);color:#fff}.w{max-width:1000px;margin:auto;padding:34px 20px}.section{background:#fff;border:1px solid var(--l);border-radius:16px;padding:24px;margin-bottom:18px}.section h2{color:var(--d);margin-top:0}.section ul{line-height:2}.tag{display:inline-block;background:#e9f7ef;color:#18734b;border:1px solid #bce1ca;padding:5px 10px;border-radius:999px;font-weight:700;font-size:12px}.lab{background:#eef8f3;border-right:4px solid #2f8f63;padding:18px;border-radius:12px;margin-top:18px}.quiz{display:block;text-align:center;background:var(--d);color:#fff;text-decoration:none;padding:17px;border-radius:14px;font-weight:700;margin-top:22px}.back{color:var(--t);text-decoration:none;font-weight:700}</style></head><body><header class="hero"><small id="code"></small><h1 id="title"></h1><p id="desc"></p></header><nav class="nav" id="nav"></nav><main class="w"><a class="back" href="linux-index.html">← Linux+ الرئيسية</a><section class="section"><h2>محاور الدرس</h2><div id="topics"></div></section><section class="section"><span class="tag">🧪 عملي — Practical Lab</span><div class="lab" id="lab"></div></section><a class="quiz" id="quiz">📝 أسئلة هذا الدرس</a></main><script>const D={1:['Introducing Linux',['Identify Linux Characteristics','Understand Bash Interaction with Linux','Use Help in Linux','Identify the Linux Troubleshooting Methodology'],'التعرّف على بيئة Linux، تجربة أوامر Bash الأساسية، استخدام man/help، وتطبيق خطوات troubleshooting.'],2:['Administering Users and Groups',['Manage User Accounts','Manage Group Accounts','Configure Privilege Escalation','Troubleshoot User and Group Issues'],'إنشاء مستخدم ومجموعة، تعيين كلمة مرور، فحص /etc/passwd و/etc/group، وتجربة sudo وصلاحيات الإدارة.'],3:['Configuring Permissions',['Configure Standard Linux Permissions','Configure Special Linux Permissions','Configure Access Control Lists'],'تطبيق chmod وchown، قراءة rwx والـoctal، وتجربة ACLs على ملفات ومجلدات اختبار.'],4:['Implementing File Management',['Understand the Linux File System','Use File Management Commands','Find File Locations'],'تطبيق pwd, ls, cd, cp, mv, rm, mkdir وfind/locate على بنية ملفات تجريبية.'],5:['Authoring Text Files',['Edit Text Files','Manage Text Files'],'إنشاء وتحرير ملفات نصية، استخدام redirection وpipes وأدوات معالجة النصوص والأرشفة.'],6:['Managing Software',['Understand Software Management','Manage RPM Software Packages','Manage Debian-based Software','Compile from Source Code','Acquire Software','Run Software in a Sandbox'],'تثبيت/إزالة حزم، تجربة apt أو rpm/dnf حسب التوزيعة، واستخدام wget/curl في بيئة اختبار.'],7:['Administering Storage',['Understand Storage','Deploy Storage','Manage Other Storage Options','Troubleshoot Storage'],'فحص الأقراص والأقسام، mount، df/du/lsblk، والتعرّف على LVM ضمن VM تجريبية.'],8:['Managing Devices, Processes, Memory, and the Kernel',['Gather Hardware Information','Manage Processes','Manage Memory','Manage the Linux Kernel'],'استخدام ps/top/htop، فحص /proc و/dev، إدارة process signals ومراقبة الذاكرة والـkernel.'],9:['Managing Services',['Manage System Services','Configure Common System Services','Configure Localization Settings'],'تطبيق systemctl status/start/stop/enable على خدمة آمنة في VM وفحص logs المرتبطة بها.'],10:['Configuring Network Settings',['Understand Network Fundamentals','Manage Network Settings','Configure Remote Administrative Access','Troubleshoot the Network'],'استخدام ip addr/ip route/hostnamectl، اختبار DNS والاتصال، وتجربة SSH داخل المختبر.'],11:['Configuring Network Security',['Configure the Firewall','Monitor Network Traffic'],'إنشاء قواعد firewall تجريبية ومراقبة الاتصالات وحركة الشبكة بأدوات Linux.'],12:['Managing Linux Security',['Harden a Linux System','Manage Certificates','Understand Authentication','Configure SELinux or AppArmor'],'تقليل الخدمات غير اللازمة، مراجعة PAM، فحص certificates، وتجربة SELinux/AppArmor حسب التوزيعة.'],13:['Implementing Simple Scripts',['Understand Bash Scripting Basics','Use Shell Script Elements','Implement Scripts with Logical Controls'],'كتابة Bash script يحتوي variables وinput وشروط if/loops ثم تشغيله واختباره.'],14:['Using Infrastructure as Code',['Understand Infrastructure as Code','Implement Orchestration','Manage Version Control with Git'],'إنشاء Git repository وتجربة commit/branch، وقراءة نموذج YAML/Ansible بسيط في بيئة مختبر.'],15:['Managing Containers in Linux',['Understand Containers','Deploy Containers','Understand Virtualization Concepts'],'تشغيل Docker container تجريبي، pull image، فحص containers، ومقارنة container بالـVM.'],16:['Installing Linux',['The Linux Boot Process','Modify Boot Settings','Deploy Linux'],'تثبيت Linux داخل VirtualBox/VM، تتبع boot process، إنشاء حساب admin غير root وفحص إعدادات الإقلاع.']};const n=+(new URLSearchParams(location.search).get('n')||1),d=D[n]||D[1];document.title=`Linux+ Lesson ${n} — ${d[0]}`;code.textContent=`CompTIA Linux+ XK0-005 · LESSON ${n}`;title.textContent=`الدرس ${n} — ${d[0]}`;desc.textContent='شرح منظم للمفاهيم الأساسية مع تمييز الأجزاء القابلة للتطبيق العملي.';topics.innerHTML=d[1].map((x,i)=>`<h2>${n}.${i+1} ${x}</h2><ul><li>افهمي المصطلحات والأوامر المرتبطة بهذا المحور ووظيفتها.</li><li>ركّزي على متى يُستخدم المفهوم وكيف يظهر في سيناريوهات الإدارة واستكشاف الأخطاء.</li><li>دوّني الأوامر أو الملفات المهمة المرتبطة بالمحور أثناء المذاكرة.</li></ul>`).join('');lab.textContent=d[2];quiz.href=`linux-quiz.html?lesson=${n}`;nav.innerHTML='<a href="linux-index.html">🏠</a>'+Array.from({length:16},(_,i)=>`<a class="${i+1===n?'active':''}" href="linux-lesson${i+1}-guide.html">${i+1}</a>`).join('')+'<a href="linux-quiz.html">📝</a>';</script></body></html>
