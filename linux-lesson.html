<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linux+ Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>:root{--d:#0d3b4f;--o:#e8672c;--t:#12617c;--l:#d8e2e7;--m:#5b7280;--paper:#f7f9fa;--soft:#eef4f6;--green:#18734b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);font-family:'IBM Plex Sans Arabic',sans-serif;color:#10232d;line-height:1.9}.hero{background:linear-gradient(135deg,var(--d),#092b3b);color:#fff;padding:52px 22px;text-align:center}.hero small{font:13px 'IBM Plex Mono',monospace;color:#ffad84;letter-spacing:.08em}.hero h1{font-size:clamp(28px,5vw,44px);margin:10px}.hero p{color:#c7dbe3;max-width:850px;margin:auto}.nav{display:flex;gap:5px;overflow:auto;padding:10px 18px;background:#fff;border-bottom:2px solid var(--o);justify-content:flex-start;position:sticky;top:0;z-index:20}.nav a{white-space:nowrap;color:var(--d);text-decoration:none;font-weight:700;padding:7px 10px;border-radius:8px}.nav a.active{background:var(--o);color:#fff}.w{max-width:1000px;margin:auto;padding:34px 20px 80px}.back{color:var(--t);text-decoration:none;font-weight:700}.toc{display:flex;gap:8px;overflow:auto;margin:22px 0}.toc a{white-space:nowrap;background:#fff;border:1px solid var(--l);padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--t);font-size:13px;font-weight:700}.section{background:#fff;border:1px solid var(--l);border-radius:16px;padding:25px;margin:20px 0;box-shadow:0 2px 10px rgba(13,59,79,.04)}.section h2{color:var(--d);margin:0 0 8px;border-right:5px solid var(--o);padding-right:13px}.section .intro{color:var(--m);margin-bottom:15px}.section h3{color:var(--t);margin:23px 0 8px}.section ul{padding-right:24px}.section li{margin:7px 0}.cmd{direction:ltr;text-align:left;background:#0d1b22;color:#d8edf5;border-radius:12px;padding:16px 18px;overflow:auto;font:14px/1.8 'IBM Plex Mono',monospace;margin:14px 0;white-space:pre-wrap}.exam{background:#fff7f1;border:1px solid #f3c9ab;border-radius:12px;padding:15px 18px;margin-top:16px}.exam b{color:var(--o)}.tag{display:inline-block;background:#e9f7ef;color:var(--green);border:1px solid #bce1ca;padding:5px 10px;border-radius:999px;font-weight:700;font-size:12px}.lab{background:#eef8f3;border-right:4px solid #2f8f63;padding:20px;border-radius:12px;margin-top:14px}.lab ol{padding-right:23px}.quiz{display:block;text-align:center;background:var(--d);color:#fff;text-decoration:none;padding:17px;border-radius:14px;font-weight:700;margin-top:24px}@media(max-width:600px){.section{padding:19px}.hero{padding:38px 18px}}</style></head><body><header class="hero"><small id="code"></small><h1 id="title"></h1><p id="desc"></p></header><nav class="nav" id="nav"></nav><main class="w"><a class="back" href="linux-index.html">← Linux+ الرئيسية</a><div class="toc" id="toc"></div><div id="content"></div><section class="section"><span class="tag">🧪 عملي — Practical Lab</span><div class="lab" id="lab"></div></section><a class="quiz" id="quiz">📝 أسئلة هذا الدرس</a></main><script>
const D={
1:{t:'Introducing Linux',lead:'مدخل فعلي إلى Linux: فلسفة النظام، التوزيعات، Bash، أدوات المساعدة، ومنهجية استكشاف الأعطال.',s:[
['Linux Characteristics','Linux نظام تشغيل مفتوح المصدر مبني حول نواة Linux ويُستخدم على الخوادم، السحابة، الأجهزة المضمنة وأجهزة المستخدمين. فهم فلسفته يفسر لماذا تختلف طريقة الإدارة فيه عن Windows.',['Free/Open Source يعني أن الشفرة متاحة وفق الرخصة ويمكن تعديلها وتوزيعها بشروط الرخصة.','Unix سبق Linux تاريخيًا؛ Linux تبنّى كثيرًا من فلسفة Unix مثل الأدوات الصغيرة، الملفات النصية، والواجهة الطرفية.','التوزيعة Distro تجمع Kernel + أدوات النظام + مدير حزم + واجهة/خدمات؛ أمثلة شائعة: Ubuntu/Debian وRHEL/Fedora وSUSE.','CLI مهم في الإدارة لأنه سريع، قابل للأتمتة ويعمل عن بعد حتى بدون واجهة رسومية.']],
['Bash Interaction','Bash هو shell يفسر الأوامر. أهم مهارة هنا ليست حفظ كل أمر؛ بل فهم صيغة الأمر: command ثم options ثم arguments.',['Tab Completion يقلل الأخطاء ويكمل أسماء الملفات والأوامر.','History يعيد الأوامر السابقة ويمكن البحث فيها بدل إعادة الكتابة.','الأوامر قد تكون built-in داخل shell أو برامج تنفيذية مستقلة.','su يبدّل المستخدم، بينما sudo يشغّل أمرًا بصلاحية أعلى وفق سياسة /etc/sudoers.'],`pwd\nls -la\necho "Hello Linux"\nhistory\nwhoami\nsudo -l`],
['Help & Documentation','Linux يفترض أن المدير يعرف كيف يجد المعلومة. لذلك man و--help وapropos أدوات عمل يومية وليست فقط للاختبار.',['man command يعرض صفحة الدليل الرسمية للأمر.','command --help يعرض ملخص الاستخدام والخيارات غالبًا.','apropos يبحث في وصف صفحات man عندما تعرف الوظيفة ولا تعرف اسم الأمر.','توثيق التوزيعة والمشروع الأصلي مهم عندما تختلف الخيارات بين الإصدارات.'],`man ls\nls --help\napropos password`],
['Troubleshooting Methodology','استكشاف الأعطال يبدأ بتحديد المشكلة ونطاقها، ثم فرضية واختبار وتوثيق. القفز للحل بدون فهم السبب قد يخفي العطل ويصنع مشكلة ثانية.',['اجمع الأعراض من المستخدم، السجلات، أدوات المراقبة ورسائل النظام.','حدّد هل المشكلة جهاز واحد أم خدمة أم شبكة كاملة.','أنشئ نسخة احتياطية قبل تغييرات خطرة، وغيّر متغيرًا واحدًا كل مرة.','بعد الحل اختبر الخدمة ووثّق السبب والخطوات والنتيجة.']]],lab:['مختبر Bash والمساعدة',['افتح Terminal في Ubuntu/Kali.','نفّذ pwd وls -la وwhoami وhistory.','استخدم man ls ثم ابحث داخل الصفحة عن خيار -a.','جرّب Tab لإكمال اسم ملف.','اكتب مشكلة بسيطة مثل ملف غير موجود وطبّق: تحديد المشكلة → جمع معلومات → اختبار فرضية → توثيق.']]},
2:{t:'Administering Users and Groups',lead:'إدارة الحسابات والمجموعات والتصعيد بالصلاحيات مع فهم الملفات التي تخزن الهوية.',s:[
['User Accounts','Linux يعرّف المستخدم عبر UID ومجموعة أساسية GID ومجلد Home وShell. /etc/passwd يحتوي تعريف الحساب، بينما hashes كلمات المرور توجد في /etc/shadow.',['root يملك UID 0. الحسابات النظامية تُستخدم للخدمات، والحسابات البشرية العادية تكون عادة UIDs أعلى بحسب التوزيعة.','useradd ينشئ الحساب، passwd يعيّن/يغير كلمة المرور، usermod يعدّل الخصائص، userdel يحذف الحساب.','chage يدير عمر كلمة المرور والانتهاء ويُستخدم لفرض سياسات الحساب.','تعطيل الحساب يختلف عن حذف ملفاته؛ في بيئة عمل عادة تحافظ على البيانات ثم تلغي الوصول.'],`sudo useradd -m testuser\nsudo passwd testuser\nid testuser\nsudo chage -l testuser\ngetent passwd testuser`],
['Groups','المجموعة تسمح بمنح الصلاحية لعدة مستخدمين بدل إدارة كل مستخدم منفردًا.',['/etc/group يعرّف المجموعات وأعضاء المجموعات الثانوية.','groupadd ينشئ مجموعة وgroupmod يعدلها وgroupdel يحذفها.','usermod -aG يضيف المستخدم لمجموعة ثانوية؛ حذف -a قد يستبدل عضويات موجودة.','الأمر id يوضح UID وGID وكل المجموعات التي ينتمي لها المستخدم.'],`sudo groupadd analysts\nsudo usermod -aG analysts testuser\nid testuser\ngetent group analysts`],
['Privilege Escalation','لا يُفضّل العمل كـroot طوال الوقت. مبدأ أقل الصلاحيات يعني استخدام حساب عادي ثم رفع الصلاحية فقط عند الحاجة.',['su يفتح جلسة كمستخدم آخر وقد يتطلب كلمة مرور ذلك المستخدم.','sudo يطبق سياسات مركزية ويترك أثرًا في السجلات، لذلك هو أفضل للإدارة اليومية.','ملف /etc/sudoers يجب تحريره عادة عبر visudo للتحقق من الصياغة.','NOPASSWD يقلل الاحتكاك لكنه يرفع الخطر ويجب استخدامه بحذر.'],`sudo -l\nsudo systemctl status ssh\nsu -`],
['Troubleshooting Users','عند فشل الدخول راجعي وجود الحساب، shell، حالة كلمة المرور، المجموعات، home directory وسياسات PAM.',['id وgetent يتحققان من تعريف الهوية.','passwd -S يعرض حالة كلمة المرور.','صلاحيات home غير الصحيحة قد تمنع الوصول أو استخدام SSH keys.','العضوية الجديدة في group قد تحتاج تسجيل خروج/دخول لتظهر في الجلسة.']]],lab:['مختبر المستخدمين والمجموعات',['أنشئ مستخدمًا testuser مع home directory.','أنشئ مجموعة analysts وأضف المستخدم لها.','افحص /etc/passwd و/etc/group باستخدام getent بدل تعديل الملفات يدويًا.','نفّذ sudo -l لمعرفة الصلاحيات.','غيّر عمر كلمة المرور باستخدام chage ثم اعرض النتيجة.']]},
3:{t:'Configuring Permissions',lead:'فهم rwx والملكية ثم الانتقال إلى SUID/SGID/Sticky Bit وACLs.',s:[
['Standard Permissions','كل ملف/مجلد له Owner وGroup وثلاث مجموعات صلاحيات: user, group, others. معنى r/w/x يختلف قليلًا بين الملف والمجلد.',['للملف: r قراءة، w تعديل المحتوى، x تشغيله.','للمجلد: r عرض الأسماء، w إنشاء/حذف entries، x الدخول/الوصول للمسارات داخله.','ls -l يعرض permission string مثل -rwxr-x---.','chmod يغير الصلاحيات إما symbolic مثل g+w أو octal مثل 750.'],`ls -l file1\nchmod 640 file1\nchmod u+x script.sh\nchmod g-w file1`],
['Ownership','الصلاحيات لا تفهم بدون معرفة من هو المالك وما المجموعة المالكة.',['chown user file يغير المالك.','chown user:group file يغير المالك والمجموعة معًا.','chgrp group file يغير المجموعة فقط.','الخيار -R يطبق التغيير تكراريًا على شجرة مجلدات ويجب استخدامه بحذر.'],`sudo chown testuser:analysts report.txt\nsudo chown -R testuser:analysts project/`],
['Special Permissions','SUID وSGID وSticky Bit تغير سلوك التنفيذ أو وراثة المجموعة أو الحذف.',['SUID على executable يجعل العملية تعمل بهوية مالك الملف؛ لذلك الملفات SUID حساسة أمنيًا.','SGID على مجلد يجعل الملفات الجديدة ترث مجموعة المجلد، وهو مفيد للمجلدات المشتركة.','Sticky Bit على مجلد مشترك يمنع المستخدم من حذف ملفات غيره رغم امتلاكه write على المجلد.','ابحثي عن special bits غير الضرورية لأنها قد تسبب privilege escalation.'],`chmod 2770 shared/\nchmod +t shared/\nfind / -perm -4000 2>/dev/null`],
['ACLs','ACL تضيف صلاحيات لمستخدم أو مجموعة إضافية بدون تغيير owner/group الأساسيين.',['getfacl يعرض ACL الحالية.','setfacl -m يضيف/يعدل rule.','setfacl -x يزيل entry.','Mask في ACL قد يقيّد effective permissions حتى لو entry نفسها أوسع.'],`getfacl report.txt\nsetfacl -m u:testuser:r-- report.txt`]],lab:['مختبر الصلاحيات',['أنشئ ملفًا ومجلدًا تجريبيين.','طبّق chmod بالـoctal ثم بالـsymbolic وقارن ls -l.','غيّر المالك والمجموعة بـchown.','أنشئ shared directory مع SGID وSticky Bit وافهم الأثر.','أضف ACL لمستخدم إضافي ثم راجعها بـgetfacl.']]},
4:{t:'Implementing File Management',lead:'نظام الملفات، المسارات، الروابط، أوامر إدارة الملفات، البحث، والـredirection.',s:[
['Filesystem & Paths','Linux يستخدم شجرة واحدة تبدأ من /. معرفة مواقع مثل /etc و/home و/var و/tmp و/usr و/boot تسهّل الإدارة واستكشاف الأعطال.',['Absolute path يبدأ بـ/ ويحدد المسار كاملًا. Relative path يبدأ من current directory.','. يعني المجلد الحالي و.. الأب و~ home للمستخدم.','Hard link يشير لنفس inode، بينما symbolic link يحتوي مسارًا للهدف ويمكنه عبور filesystems.'],`pwd\ncd /var/log\ncd ..\ncd ~\nln file1 hard1\nln -s /var/log/syslog syslog-link`],
['File Commands','العمل اليومي يعتمد على إنشاء ونسخ ونقل وحذف الملفات والمجلدات مع فحص المحتوى.',['ls يعرض المحتوى، mkdir ينشئ مجلدًا، touch ينشئ ملفًا فارغًا/يحدّث timestamp.','cp ينسخ، mv ينقل أو يعيد التسمية، rm يحذف.','less وmore للقراءة التفاعلية، head لبداية الملف، tail لنهايته.','tail -f مهم لمراقبة log يتحدث لحظيًا.'],`mkdir lab\ntouch lab/a.txt\ncp lab/a.txt lab/b.txt\nmv lab/b.txt lab/report.txt\nhead -n 10 /etc/passwd\ntail -f /var/log/syslog`],
['grep & Redirection','grep يفلتر النصوص، والـredirectors تغيّر مسار stdin/stdout/stderr. هذه أساس معالجة السجلات والـpipelines.',['> يكتب ويستبدل الملف، >> يضيف في النهاية.','2> يوجه الأخطاء، و2>&1 يدمج stderr مع stdout.','| يرسل مخرجات أمر كمدخل لأمر آخر.','grep -i يتجاهل حالة الأحرف و-r يبحث تكراريًا.'],`grep -i "error" app.log\ngrep -r "PermitRootLogin" /etc/ssh 2>/dev/null\nps aux | grep ssh\necho "done" >> notes.txt`],
['Locate Files','find يبحث لحظيًا في filesystem بمعايير قوية، بينما locate يعتمد قاعدة بيانات وقد يكون أسرع لكنه قد يكون غير محدث.',['find يمكنه البحث بالاسم والنوع والمالك والحجم والصلاحيات.','which يبحث عن executable ضمن PATH.','whereis يبحث عن binary/source/man.','تجنبي تشغيل عمليات حذف مع find قبل اختبار النتائج.'],`find /var/log -type f -name "*.log"\nfind / -user testuser 2>/dev/null\nwhich ssh`]],lab:['مختبر إدارة الملفات',['أنشئ شجرة مجلدات داخل ~/file-lab.','طبّق cp/mv/rm وراقب النتيجة بـls -la.','استخدم head/tail/less لقراءة ملف نصي.','ابحث عن كلمة بـgrep ثم أرسل الناتج إلى ملف باستخدام >.','استخدم find للبحث عن كل ملفات .txt في المختبر.']]},
5:{t:'Authoring Text Files',lead:'تحرير النصوص بـVim/Nano وإدارة الأرشفة والنسخ منخفض المستوى.',s:[
['Vim','Vim محرر modal: Command Mode للتنقل والأوامر، Insert Mode للكتابة، Execute Mode لأوامر مثل الحفظ والخروج.',['i يدخل Insert Mode وEsc يعود إلى Command Mode.','yy ينسخ سطرًا وdd يحذفه وp يلصق.','/pattern يبحث داخل الملف.','في Execute Mode: :w حفظ، :q خروج، :wq حفظ وخروج، :q! خروج بدون حفظ.','يمكن تقسيم الشاشة أفقيًا أو عموديًا للعمل على أكثر من ملف.'],`vim notes.txt\n# داخل Vim\ni\n<Esc>\n:wq`],
['Nano & GUI Editors','Nano أبسط ويعرض الاختصارات أسفل الشاشة؛ ^ يعني Ctrl. Gedit مثال لمحرر رسومي.',['Ctrl+O للحفظ وCtrl+X للخروج في nano.','المحرر النصي مهم لتعديل ملفات إعدادات الخوادم بدون GUI.','اختيار المحرر لا يغير صيغة الملف؛ المهم فهم المحتوى والنسخة الاحتياطية قبل التعديل.'],`nano /tmp/notes.txt`],
['Archives with tar','tar يجمع عدة ملفات في archive؛ الضغط يمكن إضافته بـgzip/bzip2/xz.',['c إنشاء archive، x استخراج، t عرض المحتوى، v verbose، f اسم الملف.','z يعني gzip غالبًا وJ يعني xz.','tar لا يساوي backup strategy كاملة؛ هو أداة أرشفة وقد يكون جزءًا من النسخ الاحتياطي.'],`tar -czvf logs.tar.gz /var/log/myapp\ntar -tzf logs.tar.gz\ntar -xzvf logs.tar.gz`],
['cpio & dd','cpio ينقل مجموعات ملفات عبر streams، وdd ينسخ blocks منخفضة المستوى ويمكنه إنشاء صور أقراص أو ملفات بحجم محدد.',['dd قوي وخطر لأن عكس if وof قد يكتب فوق قرص.','استخدمي lsblk للتأكد من أسماء الأجهزة قبل أي عملية قرص.','يمكن استخدام dd لأغراض imaging أو اختبار I/O أو إنشاء ملف.'],`dd if=/dev/zero of=test.img bs=1M count=100`]],lab:['مختبر تحرير وأرشفة',['أنشئ notes.txt وعدّله مرة بـnano ومرة بـvim.','احفظ نسخة backup قبل تعديل ملف إعداد تجريبي.','أنشئ مجلدًا فيه ثلاثة ملفات واضغطه بـtar.gz.','اعرض محتوى archive بدون فك الضغط.','أنشئ ملف 20MB باستخدام dd داخل /tmp فقط.']]},
6:{t:'Managing Software',lead:'مديرو الحزم، repositories، RPM/DNF/YUM، APT، compilation، التنزيل، والعزل.',s:[
['Software Lifecycle','مدير الحزم يثبت ويحدّث ويزيل software مع metadata وdependencies. المستودع Repository مصدر موثوق للحزم والتحديثات.',['الحزمة precompiled أسهل وأقرب للتحديث الأمني المنظم.','Compiling from source يعطي تحكمًا أكبر لكنه يزيد مسؤولية التحديث والاعتماديات.','Dependencies هي مكتبات/حزم يحتاجها البرنامج.','استخدام repo غير موثوق يخلق supply-chain risk.']],
['RPM / YUM / DNF','rpm يدير حزم .rpm مباشرة، بينما yum/dnf يحلان dependencies ويتعاملان مع repositories.',['rpm -q للاستعلام و-i للتثبيت و-e للإزالة.','dnf install/update/remove أو yum equivalents شائعة في RHEL/Fedora.','إعدادات المستودعات توجد عادة في /etc/yum.repos.d/.','dnf repolist يعرض repositories المفعلة.'],`rpm -qa | head\ndnf repolist\nsudo dnf install package\nsudo dnf update`],
['Debian / APT','dpkg أداة منخفضة المستوى لحزم .deb، وapt يتعامل مع repositories وdependencies.',['apt update يحدّث metadata ولا يحدّث الحزم نفسها.','apt upgrade يحدّث الحزم المثبتة وفق القواعد.','apt install/remove لإدارة الحزم.','مصادر APT معرفة في /etc/apt/sources.list وملفات sources.list.d.'],`sudo apt update\napt list --upgradable\nsudo apt install curl\napt show curl`],
['Acquire / Source / Sandbox','wget وcurl ينزلان الملفات ويمكن دمجهما في scripts. compilation من source يتطلب قراءة تعليمات المشروع. Sandboxing يقلل أثر برنامج غير موثوق.',['curl مناسب للـHTTP APIs أيضًا، وwget ممتاز للتنزيلات المباشرة/المتكررة.','تحققي من checksum/signature للحزم المهمة قبل التنفيذ.','لا تشغلي binary مجهول بصلاحية root لمجرد أنه تم تنزيله بنجاح.'],`wget https://example.com/file.tar.gz\ncurl -O https://example.com/file.tar.gz\nsha256sum file.tar.gz`]],lab:['مختبر إدارة البرامج',['حدّث metadata لمدير الحزم المناسب لتوزيعتك.','ابحث عن حزمة ثم اعرض معلوماتها بدون تثبيت.','ثبّت أداة بسيطة في VM ثم تحقق من الإصدار وأزلها.','نزّل ملفًا تجريبيًا بـcurl أو wget وافحص hash.','راجع ملفات repository configuration بدون تعديل repository الإنتاج.']]},
7:{t:'Administering Storage',lead:'من partitions وfilesystems إلى LVM وmount وRAID والـquotas واستكشاف مشاكل المساحة.',s:[
['Storage Concepts','الأقراص قد تكون محلية أو SAN/NAS أو cloud-backed. التقسيم التقليدي ثابت نسبيًا، بينما LVM يضيف طبقة مرنة بين القرص والـfilesystem.',['MBR أقدم وله قيود، GPT أحدث ويدعم أقراصًا وأقسامًا أكثر.','RAID يجمع أقراصًا لتحقيق redundancy و/أو performance حسب المستوى.','Filesystem مثل XFS/ext4/Btrfs ينظم الملفات فوق block device.','Disk quota يقيّد استهلاك مستخدم/مجموعة للمساحة أو inodes.']],
['Deploy Storage','التسلسل النموذجي: اكتشاف القرص → partition → filesystem → mount → اختبار → إضافة إلى fstab إن كان mount دائمًا.',['lsblk وblkid يعرضان block devices والـUUIDs.','fdisk/parted لتقسيم الأقراص حسب السيناريو.','mkfs ينشئ filesystem ويؤدي إلى فقد المحتوى السابق على القسم.','mount يربط filesystem بمجلد، وumount يفصله.'],`lsblk\nblkid\nsudo mount /dev/sdb1 /mnt/data\ndf -h /mnt/data`],
['LVM','LVM يتكون من PV ثم VG ثم LV؛ بعد ذلك تنشئ filesystem على LV.',['Physical Volume يمثل disk/partition داخل LVM.','Volume Group يجمع السعة.','Logical Volume يشبه partition مرن يمكن توسيعه.','توسيع LV لا يعني دائمًا توسع filesystem تلقائيًا؛ يجب فهم أداة filesystem.'],`pvs\nvgs\nlvs`],
['Troubleshooting Storage','المساحة الممتلئة ليست السبب الوحيد لفشل الكتابة؛ قد تنفد inodes أو يكون filesystem read-only أو mount غير موجود.',['df -h لمساحة filesystem وdf -i للـinodes.','du -sh يقيس استهلاك مجلد/ملف.','lsblk يوضح topology وmount points.','/etc/fstab خطأ فيه قد يسبب مشاكل boot؛ استخدمي UUID واختبري mount -a بعد التعديل.'],`df -h\ndf -i\ndu -sh /var/* 2>/dev/null | sort -h\nmount | column -t`]],lab:['مختبر التخزين',['أضيفي Virtual Disk صغير للـVM إن أمكن.','استخدمي lsblk للتأكد من القرص الجديد قبل أي كتابة.','أنشئي partition/filesystem ومجلد mount في المختبر.','اختبري mount يدويًا ثم df -h.','تدربي على df -i وdu لاكتشاف اختلاف المساحة عن عدد الملفات.']]},
8:{t:'Managing Devices, Processes, Memory, and the Kernel',lead:'قراءة الأجهزة، إدارة العمليات والذاكرة، وفهم دور Kernel والـmodules.',s:[
['Hardware & /dev','Linux يمثل كثيرًا من الأجهزة كملفات تحت /dev، ويعرض معلومات ديناميكية عن النظام في /proc. udev يدير اكتشاف الأجهزة وتسميتها.',['Block devices مثل disks تتعامل مع blocks، character devices تتعامل مع stream.','lspci وlsusb يعرضان أجهزة PCI/USB.','/dev/null يتخلص من البيانات، /dev/zero يولد أصفارًا، /dev/urandom يولد بيانات عشوائية.','المعلومات التي يراها Linux هي الأجهزة التي اكتشفها، وليس بالضرورة كل hardware الموجود فعليًا.'],`lsblk\nlspci | head\nlsusb\ncat /proc/cpuinfo | head\nfree -h`],
['Processes','Process هو instance من برنامج يعمل وله PID، parent، حالة وأولوية وموارد.',['ps snapshot، top/htop monitoring تفاعلي.','kill يرسل signal؛ SIGTERM طلب إنهاء منظم، SIGKILL إيقاف قسري.','nice يحدد priority عند بدء process، renice يعدل process موجود.','lsof يربط open files بالعمليات ومفيد لمعرفة من يحتجز port أو file.'],`ps aux | head\ntop\nlsof -i :22\nkill -TERM <PID>\nnice -n 10 command`],
['Process States & Jobs','الحالات الشائعة تشمل running/sleeping/stopped/zombie. jobs هي عمليات بدأها shell ويمكن نقلها foreground/background.',['Ctrl+Z يوقف job مؤقتًا، bg يكمله في الخلفية، fg يعيده للمقدمة.','Zombie انتهى لكن parent لم يجمع exit status بعد؛ قتل zombie نفسه غالبًا ليس الحل.','ارتفاع CPU يحتاج تحديد process ثم فهم سبب الحمل قبل الإنهاء.'],`jobs\nbg %1\nfg %1`],
['Memory & Kernel','Kernel يدير memory، processes، devices، filesystems وتخصيص الموارد. Modules تسمح بإضافة drivers/features دون إعادة بناء kernel كامل.',['free وvmstat وtop أدوات مهمة للذاكرة.','Swap مساحة على disk تستخدم عند ضغط الذاكرة لكنها أبطأ من RAM.','uname يعرض kernel info، lsmod يعرض modules.','modprobe يحمل/يزيل modules مع مراعاة dependencies.'],`uname -r\nlsmod | head\nfree -h\nvmstat 1 5`]],lab:['مختبر العمليات والموارد',['افحص CPU وRAM بـlscpu/free.','شغّل process بسيط في الخلفية وحدد PID.','راقبه بـps/top ثم أرسل SIGTERM.','استخدم lsof على ملف أو port معروف.','اعرض kernel version وmodules بدون تغيير kernel.']]},
9:{t:'Managing Services',lead:'systemd، targets، SSH، rsyslog، logging، الوقت والـlocalization.',s:[
['systemd & systemctl','الخدمة في systemd تُمثل unit. systemctl يدير start/stop/restart/status وenable/disable ويعرض dependencies والحالة.',['start يؤثر الآن، enable يحدد التشغيل تلقائيًا عند boot؛ هما ليسا الشيء نفسه.','mask يمنع تشغيل unit يدويًا أو تلقائيًا حتى unmask.','targets تجمع units وتمثل حالات/أهداف تشغيل أعلى مستوى.','journalctl يقرأ systemd journal ويربط السجلات بالـunits والزمن.'],`systemctl status ssh\nsudo systemctl restart ssh\nsystemctl is-enabled ssh\njournalctl -u ssh --since today`],
['SSH Service','SSH يوفر remote shell، command execution، tunneling ونقل ملفات عبر أدوات مثل scp/sftp.',['إعداد الخادم غالبًا /etc/ssh/sshd_config.','غيّري الإعدادات بحذر ثم اختبري syntax واتركي جلسة حالية مفتوحة لتجنب lockout.','تعطيل root login وكلمات المرور قد يكون مناسبًا بعد تفعيل key authentication.','Firewall يجب أن يسمح بالمنفذ المقصود إن كان SSH مطلوبًا.']],
['Logging with rsyslog','السجلات تساعد في detection وtroubleshooting. syslog يستخدم facility وseverity لتوجيه الرسائل.',['rsyslog يمكنه تخزين logs محليًا أو forwarding إلى server مركزي.','المركزية تقلل فقد الأدلة عند اختراق/تعطل جهاز.','journal وrsyslog قد يتعايشان حسب التوزيعة.','تزامن الوقت ضروري لربط الأحداث بين الأنظمة.'],`journalctl -p warning\ntail -f /var/log/syslog`],
['Localization','timezone وlocale يؤثران على الوقت، اللغة، encoding والفرز.',['timedatectl يعرض/يضبط timezone والوقت على systemd.','localectl يعرض إعدادات locale وkeyboard.','NTP/chrony يحافظ على time synchronization.']]],lab:['مختبر الخدمات والسجلات',['افحص status لخدمة SSH بدون تغييرها إن كنت متصلة عن بعد.','ابدأ/أوقف خدمة تجريبية آمنة في VM وراقب status.','استخدم journalctl -u لقراءة أحداث الخدمة.','اعرض timedatectl وlocalectl.','أنشئ log entry باستخدام logger ثم ابحث عنها في السجلات.']]},
10:{t:'Configuring Network Settings',lead:'أساس TCP/IP، عناوين IPv4/IPv6، إعداد الواجهات، DNS، routes وSSH واستكشاف الشبكة.',s:[
['TCP/IP Fundamentals','كل node يحتاج identity شبكية: hostname وIP وMAC. IP يحدد logical location، MAC يعمل على الوصلة المحلية، والـhostname اسم سهل للبشر.',['TCP/IP stack يقسم الاتصال إلى طبقات لتسهيل الفهم والاستكشاف.','Subnet mask/prefix يحدد أي جزء network وأي جزء host.','Default gateway يستخدم للوصول إلى شبكات خارج subnet.','IPv6 يستخدم 128-bit addresses ويختلف في representation وآليات الشبكة المحلية.']],
['Manage Interfaces','ip هو الأداة الحديثة لعرض العناوين والروابط والroutes. NetworkManager يوفر nmcli/nmtui وإدارة persistent configuration.',['ip addr يعرض addresses، ip link حالة interfaces، ip route جدول التوجيه.','Static IP ثابت يحدد يدويًا، DHCP يطلب إعدادات من server.','hostnamectl يدير hostname.','تغيير runtime لا يضمن استمرار الإعداد بعد reboot؛ يجب فهم طريقة التوزيعة.'],`ip addr\nip link\nip route\nhostnamectl\nnmcli device status`],
['Name Resolution','Linux قد يستخدم /etc/hosts ثم DNS حسب /etc/nsswitch.conf. /etc/resolv.conf يحدد resolvers/search domains في كثير من البيئات.',['DNS يترجم names إلى addresses والعكس.','getent hosts يحترم NSS policy وغالبًا أفضل لاختبار الطريقة التي يستخدمها النظام.','dig وhost وnslookup أدوات تشخيص DNS.','فشل DNS لا يعني فشل IP connectivity؛ اختبريهما منفصلين.'],`getent hosts example.com\ndig example.com\ncat /etc/resolv.conf`],
['Remote Access & Troubleshooting','ابدئي من الأسفل للأعلى: link → address → route → DNS → port/service.',['ping يختبر reachability/ICMP لكن بعض الأجهزة تحجبه.','ip route يوضح default route ومشاكل تعدد gateways.','ss يعرض sockets والports listening.','ssh user@host يختبر remote administration بعد تحقق الشبكة والخدمة.'],`ping -c 4 8.8.8.8\nping -c 4 example.com\nss -tulpn\nssh user@server`]],lab:['مختبر الشبكة',['سجلي hostname وIP وdefault route الحاليين.','اختبري gateway ثم IP خارجي ثم DNS name لتحديد طبقة العطل.','استخدمي dig/getent لمقارنة name resolution.','اعرض listening ports بـss.','إن توفر جهاز ثانٍ في المختبر، جرّبي SSH بينهما.']]},
11:{t:'Configuring Network Security',lead:'Firewalls في Linux ومراقبة الشبكة من connectivity tests إلى protocol analysis.',s:[
['Firewall Concepts','Firewall يطبق قواعد على traffic حسب source/destination/protocol/port/state وقد يعمل على host أو perimeter.',['ACCEPT يسمح، DROP يتجاهل، REJECT يرفض مع response.','Stateful firewall يتتبع حالة الاتصال وليس كل packet منفردة فقط.','قاعدة أوسع في ترتيب خاطئ قد تجعل قاعدة أدق بلا أثر.','أقل سطح هجوم يعني السماح فقط بالخدمات المطلوبة.']],
['iptables / nftables / firewalld / UFW','iptables واجهة تقليدية، nftables أحدث، firewalld طبقة إدارة zones، وUFW واجهة مبسطة شائعة في Ubuntu.',['لا تخلطي أدوات الإدارة على نفس الجهاز بدون فهم backend.','firewalld zones تصنف trust level للinterfaces/connections.','nftables يبني rulesets حديثة مرنة.','قبل تعديل firewall عن بعد، خططي لطريقة recovery حتى لا تقطعي SSH.'],`sudo firewall-cmd --list-all\nsudo ufw status\nsudo nft list ruleset`],
['Traffic Monitoring','أدوات المراقبة تنقسم إلى اختبار اتصال، socket/connection inspection، وpacket capture/protocol analysis.',['ping/traceroute/mtr تساعد في المسار والlatency.','ss/netstat يربطان sockets بالخدمات.','tcpdump capture من CLI، Wireshark تحليل GUI غني.','Packet capture قد يحتوي بيانات حساسة؛ خزنيه وشاركيه كدليل أمني.'],`mtr example.com\nss -tan\nsudo tcpdump -i any port 53`],
['Troubleshooting Firewall','إذا الخدمة تعمل محليًا ولا تصل عن بعد، افحص listen address ثم host firewall ثم network firewall ثم routing.',['اختبر الخدمة محليًا أولًا.','افحص rule counters إن كانت متاحة لمعرفة هل traffic يصل للقاعدة.','لا تحل المشكلة بتعطيل firewall كاملًا في الإنتاج.']]],lab:['مختبر Firewall آمن',['اعرض القواعد الحالية فقط أولًا.','شغّل web server محليًا على port تجريبي إن أمكن.','اسمح بالport من شبكة المختبر ثم اختبر الاتصال.','التقط DNS traffic بـtcpdump أثناء تنفيذ dig.','أزل القاعدة التجريبية بعد الانتهاء ووثّق ما حدث.']]},
12:{t:'Managing Linux Security',lead:'Hardening، التشفير والـhashing، certificates، authentication/PAM، SELinux وAppArmor.',s:[
['System Hardening','Hardening يقلل attack surface ويحسن مقاومة النظام. يبدأ بالمخزون والتحديث ثم إزالة ما لا يلزم وتطبيق أقل صلاحية.',['أزل services/software غير المطلوبة بدل تركها idle.','حدّث OS والتطبيقات من sources موثوقة.','قلل صلاحيات المستخدمين والخدمات وافصل accounts الإدارية.','راجع permissions، remote access، firewall، logging وsecurity baselines.','الأهداف الأمنية تشمل Confidentiality وIntegrity وAvailability.']],
['Encryption & Hashing','التشفير يحمي السرية ويمكن فكّه بالمفتاح المناسب. Hashing أحادي الاتجاه ويُستخدم للتحقق من integrity وكلمات المرور ضمن تصميم آمن.',['Symmetric أسرع ويستخدم shared secret.','Asymmetric يستخدم public/private pair ويدعم تبادل المفاتيح والتوقيع.','Hash يتغير إذا تغيرت البيانات ويساعد في اكتشاف tampering.','md5sum مفيد لفهم checksum لكن MD5 ضعيف للتطبيقات الأمنية الحديثة؛ استخدمي SHA-256 عند الحاجة الأمنية الحديثة.'],`sha256sum file.iso\nmd5sum file.iso`],
['Certificates & PKI','Certificate تربط public key بهوية. CA تصدر/توقع certificates ضمن PKI وتسمح ببناء chain of trust.',['Use cases تشمل HTTPS، secure email، client/server authentication وsmart cards.','Private key يجب أن يبقى سريًا؛ certificate نفسها تحتوي public information.','انتهاء/إلغاء certificate قد يسبب فشل TLS حتى لو الشبكة تعمل.','openssl أداة شائعة لفحص certificates والkeys والTLS.'],`openssl x509 -in cert.pem -text -noout\nopenssl s_client -connect example.com:443 -servername example.com`],
['Authentication & PAM','PAM framework يفصل تطبيقات login/sudo/sshd عن تفاصيل authentication policy عبر modules وstacks.',['/etc/passwd يعرّف الحسابات و/etc/shadow يحمي password hashes.','PAM يمكنه فرض password policy، access restrictions وMFA بحسب modules.','تغيير PAM خطير لأنه قد يمنع جميع logins؛ اختبري في VM واحتفظي بجلسة recovery.','SSO هدفه المصادقة مرة للوصول إلى موارد متعددة عبر بنية موثوقة.']],
['SELinux & AppArmor','هذه Mandatory Access Control frameworks تضيف policy فوق Unix permissions.',['SELinux يستخدم labels/contexts وقواعد policy؛ modes تشمل enforcing/permissive/disabled.','AppArmor يعتمد profiles مرتبطة عادة بالمسارات/البرامج.','chmod 777 لا يحل denial سببه SELinux/AppArmor.','راجعي audit logs والسياق قبل تعطيل الضابط.'],`getenforce\nls -Z /var/www 2>/dev/null\nsestatus 2>/dev/null\naa-status 2>/dev/null`]],lab:['مختبر Hardening',['اعمل inventory للخدمات listening بـss -tulpn.','حدد خدمة غير لازمة في VM فقط وتحقق من status قبل/بعد إيقافها.','احسب SHA-256 لملف ثم عدّل الملف وأعد الحساب.','افحص certificate موقع بـopenssl s_client.','اعرض حالة SELinux أو AppArmor وسجّل الفرق بدون تعطيل الحماية.']]},
13:{t:'Implementing Simple Scripts',lead:'بناء Bash scripts من syntax وvariables إلى conditions/loops والـredirection والexit codes.',s:[
['Script Basics','الـscript ملف أوامر ينفذها interpreter. shebang يحدد interpreter، والصلاحية x تسمح بالتشغيل المباشر.',['ابدئي بـ#!/bin/bash أو interpreter المناسب.','التعليقات تبدأ بـ# وتوثق النية لا الأمور الواضحة فقط.','chmod +x يجعل الملف executable.','تشغيل ./script.sh يختلف عن bash script.sh في اعتماد executable bit/shebang.'],`#!/bin/bash\necho "Hello World"`],
['Shell Elements','المتغيرات تخزن قيمًا، read يأخذ input، echo/printf يعرضان output، arrays/functions تنظم logic.',['VAR=value بدون مسافات حول = في Bash assignment المعتاد.','$VAR يسترجع القيمة، و${VAR} أوضح عند دمج النص.','"double quotes" توسع variables، بينما single quotes تحفظ النص حرفيًا غالبًا.','exit code 0 يعني success عادة، والقيم الأخرى تعني failure/condition.'],`name="Lujain"\necho "Hello $name"\nread -p "Enter host: " host\necho "$host"`],
['Logic Controls','if/case لاتخاذ قرار، for/while للتكرار. الاختبارات تقارن strings/numbers/files.',['[ -f file ] يتحقق من ملف عادي.','&& يشغل التالي عند النجاح، || عند الفشل.','case أنظف من سلسلة if طويلة عند القيم المحددة.','loops تحتاج شرط خروج واضح لتجنب infinite loop.'],`if [ -f /etc/passwd ]; then\n  echo "exists"\nfi\n\nfor u in root nobody; do\n  id "$u"\ndone`],
['Regex, Streams & Here Docs','Regex تصف أنماط النص، والـstandard streams هي stdin/stdout/stderr. Here document يمرر block نصي لأمر.',['grep/sed/awk أدوات شائعة لمعالجة النص.','> و>> و2> و| تسمح ببناء pipelines.','اختبري regex على بيانات غير حساسة أولًا لأن pattern خاطئ قد يعطي false matches.'],`grep -E '^[a-z_][a-z0-9_-]*:' /etc/passwd | head\ncommand >out.txt 2>err.txt`]],lab:['مختبر Bash Script',['اكتب script يطلب username باستخدام read.','تحقق بـid هل المستخدم موجود.','إذا موجود اطبع UID والمجموعات؛ إذا غير موجود اطبع رسالة واضحة.','أضف exit codes مختلفة للحالتين.','شغّل shellcheck إن توفر لتعلم أخطاء الصياغة.']]},
14:{t:'Using Infrastructure as Code',lead:'DevOps وCI/CD وIaC، YAML/JSON، orchestration/configuration management، وGit.',s:[
['DevOps & IaC','DevOps يقلل الفاصل بين التطوير والتشغيل عبر automation وfeedback سريع. IaC يصف البنية كملفات قابلة للمراجعة والإصدار بدل تغييرات يدوية غير موثقة.',['CI يدمج ويختبر التغييرات باستمرار، CD يؤتمت delivery/deployment حسب النموذج.','IaC يرفع repeatability ويقلل configuration drift.','التغيير في code يمكن مراجعته عبر pull request ويترك audit trail.','Secrets لا يجب حفظها كنص صريح داخل repository.']],
['JSON vs YAML','كلاهما data serialization. JSON يعتمد braces/quotes بشكل صريح؛ YAML يعتمد indentation ويستخدم كثيرًا في configuration وAnsible.',['Indentation في YAML جزء من syntax.','JSON مناسب للـAPIs والآلات ويكون أكثر صرامة.','تحققي من syntax باستخدام linters/parsers قبل deployment.']],
['Automation & Orchestration','Automation ينفذ مهمة أو سلسلة محددة، بينما orchestration ينسق عدة أنظمة/خطوات لتحقيق حالة كاملة.',['Configuration management مثل Ansible/Chef/Puppet يفرض desired state.','Idempotence تعني تكرار التشغيل لا يسبب تغييرات إضافية إذا الحالة صحيحة.','Orchestration مهم في البيئات الكبيرة حيث ترتيب dependencies matters.'],`# مثال Ansible YAML\n- hosts: web\n  become: true\n  tasks:\n    - name: Ensure nginx is installed\n      package:\n        name: nginx\n        state: present`],
['Git','Git version control موزع يتتبع history ويتيح branches وmerges. GitHub خدمة hosting/review وليست Git نفسه.',['git init ينشئ repo محلي.','git status يعرض الحالة، add يجهز staging، commit يسجل snapshot.','branch يعزل العمل، merge يدمج التاريخ.','git log مهم للتدقيق وفهم من غيّر ماذا ومتى.'],`git init\ngit status\ngit add .\ngit commit -m "Initial configuration"\ngit log --oneline`]],lab:['مختبر Git وIaC',['أنشئ folder فيه ملف YAML بسيط.','ابدأ Git repository واعمل أول commit.','أنشئ branch وعدّل الإعداد ثم اعمل commit ثاني.','قارن التغيير بـgit diff/log.','لا تضف passwords أو API keys؛ استخدم placeholder لتعلم المبدأ.']]},
15:{t:'Managing Containers in Linux',lead:'Containers وimages وDockerfile والregistries والتخزين وKubernetes، مع مقارنة virtualization.',s:[
['Container Concepts','Container يعزل application وdependencies مع مشاركة kernel host، لذلك يكون أخف عادة من VM كاملة.',['Image قالب immutable نسبيًا، container instance runtime من image.','Container engine مثل Docker/containerd يدير lifecycle.','Isolation ليست مساوية لحدود VM كاملة؛ kernel المشترك جزء من نموذج الخطر.','لا تشغلي containers بصلاحيات أعلى من الحاجة.']],
['Docker Operations','عمليات أساسية: pull image، run container، list، inspect، logs، stop، remove. Dockerfile يبني image قابلة للتكرار.',['docker pull يجلب image من registry.','docker run ينشئ ويشغل container؛ -p ينشر port و-v يربط storage.','docker logs مهم لاستكشاف التطبيق.','docker exec يشغل command داخل container موجود.'],`docker pull nginx\ndocker run -d --name web -p 8080:80 nginx\ndocker ps\ndocker logs web\ndocker exec web nginx -v\ndocker stop web\ndocker rm web`],
['Registries & Persistent Storage','Registry يخزن images؛ قد يكون public أو private. البيانات داخل writable layer قد تضيع عند حذف container، لذلك استخدمي volume/bind mount للبيانات الدائمة.',['تحققي من مصدر image وtag/digest.','قللي image size والpackages غير اللازمة لتقليل attack surface.','لا تضعي secrets داخل image layers أو Dockerfile.']],
['Kubernetes & Virtualization','Kubernetes ينسق containers على cluster ويوفر scheduling, scaling, service discovery وself-healing. VM تستخدم hypervisor وتملك guest OS كامل.',['VM عزلها أقوى غالبًا لكنها أثقل.','Containers تبدأ أسرع وتناسب microservices/CI workloads.','الاختيار يعتمد على isolation، compatibility، performance والإدارة.']]],lab:['مختبر Docker',['شغّل nginx container على port 8080.','افتح الصفحة محليًا وتأكد من الاتصال.','اعرض logs وinspect.','أنشئ ملف HTML محلي واربطه bind mount داخل nginx.','أوقف واحذف container ثم لاحظ بقاء الملف المحلي.']]},
16:{t:'Installing Linux',lead:'Boot process وGRUB2 ثم تخطيط وتثبيت Linux على physical/virtual platforms.',s:[
['Boot Process','مصدر الإقلاع قد يكون disk/USB/ISO/PXE/network. Firmware يختار device ثم bootloader يحمل kernel وinitramfs ويبدأ userspace.',['BIOS وUEFI طريقتان firmware مختلفتان؛ UEFI شائع حديثًا.','GRUB2 bootloader يختار kernel/options.','/boot يحتوي kernel images وinitramfs وملفات bootloader بحسب التوزيعة.','بعد kernel يبدأ init/systemd ويصل النظام إلى target/services المطلوبة.']],
['GRUB2 Configuration','grub2-install يثبت bootloader في سيناريوهات معينة، وgrub2-mkconfig يولد ملف configuration من الإعدادات.',['لا تعدلي generated grub.cfg يدويًا إذا التوزيعة تتوقع توليده.','خطأ root filesystem/kernel parameter قد يمنع boot.','احتفظي بوسيلة rescue/ISO قبل تجارب boot.'],`grep GRUB /etc/default/grub\n# أوامر تختلف حسب التوزيعة\ngrub2-mkconfig --help`],
['Troubleshoot Boot','حددي أين توقف boot: firmware؟ bootloader؟ kernel/initramfs؟ filesystem؟ systemd service؟',['رسائل console وjournal من boot السابق تعطي دليلًا.','filesystem أو /etc/fstab الخاطئ قد يدخل emergency mode.','kernel/initramfs mismatch قد يمنع تحميل root device.','لا تعيدي تثبيت النظام قبل جمع الأدلة وفهم الطبقة الفاشلة.'],`journalctl -b\njournalctl -b -1\nsystemctl --failed`],
['Deploy Linux','قبل التثبيت اختاري physical/virtual، distro متوافقة، method وpartitioning، ثم خططي updates وحساب admin غير root.',['VirtualBox/KVM/Hyper-V/VMware خيارات virtualization شائعة.','ISO installation مناسبة للمختبر؛ PXE/network install مفيد للتوسع.','بعد التثبيت: updates، hostname/timezone/network، admin account، SSH/firewall حسب الحاجة.','Raspberry Pi مثال لمنصة ARM تتطلب image/distro مناسبة للمعمارية.']]],lab:['مختبر تثبيت كامل',['أنشئ VM جديدة في VirtualBox مع disk افتراضي فقط.','اربط ISO وثبّت Linux مع حساب admin غير root.','بعد الإقلاع نفّذ update واضبط hostname/timezone.','اعرض /boot وkernel version وsystemctl --failed.','اكتب مخطط boot من Firmware → GRUB → Kernel/initramfs → systemd → services.']]}
};
