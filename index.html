<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompTIA Network+ N10-009 — الوحدة 1 إلى 4</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#0d3b4f;--teal:#12617c;--signal:#e8672c;--line:#d8e2e7;--muted:#5b7280;--paper:#f7f9fa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--paper);color:#0e1b25;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{max-width:640px;width:100%;text-align:center}
.eyebrow{font-family:monospace;direction:ltr;display:inline-block;font-size:13px;letter-spacing:.14em;background:rgba(232,103,44,.12);color:var(--signal);border:1px solid rgba(232,103,44,.4);padding:4px 14px;border-radius:999px;margin-bottom:16px}
h1{font-size:clamp(24px,4vw,34px);color:var(--deep);margin-bottom:10px}
p.sub{color:var(--muted);margin-bottom:36px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:520px){.cards{grid-template-columns:1fr}}
a.card{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 22px;box-shadow:0 2px 8px rgba(13,59,79,.06);transition:.15s}
a.card:hover{border-color:var(--signal);transform:translateY(-3px)}
a.card .icon{font-size:32px;margin-bottom:12px}
a.card .title{color:var(--deep);font-weight:700;font-size:18px;margin-bottom:6px}
a.card .desc{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
 <span class="eyebrow">CompTIA Network+ N10-009</span>
 <h1>مذاكرة الوحدات 1 إلى 4</h1>
 <p class="sub">Network Fundamentals · Cabling · Interfaces & Switches · Network Addressing</p>
 <div class="cards">
  <a class="card" href="N10-009-study-guide.html">
   <div class="icon">📖</div>
   <div class="title">ملخص الدراسة</div>
   <div class="desc">شرح كامل لكل الوحدات بالعربي مع المصطلحات التقنية</div>
  </a>
  <a class="card" href="N10-009-quiz.html">
   <div class="icon">📝</div>
   <div class="title">اختبار محاكي</div>
   <div class="desc">77 سؤالًا بنمط الاختبار الفعلي مع شرح فوري</div>
  </a>
 </div>
</div>
</body>
</html>
