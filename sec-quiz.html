<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>اختبارات CompTIA Security+ SY0-701</title>
<meta name="description" content="اختبارات تفاعلية تغطي جميع أقسام دروس CompTIA Security+ SY0-701 من الدرس 1 إلى 16.">
<link rel="canonical" href="https://rujeno.github.io/Security-/sec-quiz.html">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1b25;--paper:#f7f9fa;--deep:#0d3b4f;--teal:#12617c;--signal:#e8672c;--line:#d8e2e7;--muted:#5b7280;--soft:#eef4f6;--good:#1a7f5c;--bad:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--paper);color:var(--ink);line-height:1.8}
.top{background:var(--deep);border-bottom:2px solid var(--signal);overflow-x:auto;white-space:nowrap}
.topin{max-width:1040px;margin:auto;display:flex;align-items:center}
.top a{color:#bed3dc;text-decoration:none;padding:13px 11px;font-weight:700;font-size:13px;border-bottom:3px solid transparent}
.top a:hover,.top a.active{color:#fff;background:rgba(255,255,255,.06);border-bottom-color:var(--signal)}
header{background:linear-gradient(135deg,var(--deep),#092b3a);color:#fff;padding:38px 18px;text-align:center}
header h1{font-size:clamp(23px,4vw,34px)}
header p{color:#bed3dc;margin-top:7px;font-size:14px}
.wrap{max-width:960px;margin:auto;padding:28px 18px 70px}
.notice{background:#fff7f1;border:1px solid #f0c8ad;border-radius:14px;padding:14px 18px;margin-bottom:22px;color:#73411f}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.top a{padding:12px 9px}}
.card{display:block;text-decoration:none;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:20px;transition:.15s;color:inherit}
.card:hover{transform:translateY(-2px);border-color:var(--signal);box-shadow:0 5px 16px rgba(13,59,79,.09)}
.card .num{font:700 12px 'IBM Plex Mono',monospace;color:var(--signal);letter-spacing:.08em}
.card h3{color:var(--deep);margin:5px 0 3px;font-size:17px}
.card p{color:var(--muted);font-size:13px}
.card.all{grid-column:1/-1;background:linear-gradient(135deg,var(--deep),#0a2c3c);color:#fff;border-color:var(--deep)}
.card.all h3{color:#fff}.card.all p{color:#c7dce4}.card.all .num{color:#ffb48c}
#quiz,#result{display:none}
.quizhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;color:var(--muted);font-size:14px;font-weight:700}
.bar{height:8px;background:#e1eaee;border-radius:99px;overflow:hidden;margin-bottom:20px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--signal));transition:.25s}
.qbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 2px 9px rgba(13,59,79,.06)}
.qtag{display:inline-block;background:var(--soft);color:var(--teal);padding:4px 11px;border-radius:99px;font:700 12px 'IBM Plex Mono',monospace;direction:ltr;margin-bottom:12px}
.qtext{font:600 17px 'IBM Plex Mono',monospace;direction:ltr;text-align:left;color:var(--deep);line-height:1.6;margin-bottom:17px}
.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;direction:ltr;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:500 14px 'IBM Plex Mono',monospace;cursor:pointer;line-height:1.5}.opt:hover:not(:disabled){border-color:var(--teal);background:var(--soft)}.opt.correct{border-color:var(--good);background:#eaf7f1}.opt.wrong{border-color:var(--bad);background:#fdeceb}.opt:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px 15px;border-radius:12px;background:#fff7f1;border:1px solid #f0c8ad;font-size:14px}.feedback.show{display:block}.feedback b{color:var(--signal)}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}.btn{border:none;border-radius:11px;padding:10px 18px;font-family:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.btn.primary{background:var(--deep);color:#fff}.btn.secondary{background:#fff;color:var(--teal);border:1.5px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}
#result{text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:35px 22px}.score{font-size:38px;font-weight:700;color:var(--deep)}#result h2{color:var(--deep);margin-bottom:4px}.muted{color:var(--muted)}
.review{text-align:right;margin-top:24px}.review h3{color:var(--teal);margin-bottom:10px}.rv{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px}.rv.hit{border-right:4px solid var(--good)}.rv.miss{border-right:4px solid var(--bad)}.rvq{display:block;direction:ltr;text-align:left;font:500 12.5px 'IBM Plex Mono',monospace;color:#33475a;margin-top:4px}.rva{display:block;direction:ltr;text-align:left;font:600 12.5px 'IBM Plex Mono',monospace;margin-top:3px}
footer{text-align:center;color:var(--muted);font-size:12px;padding-top:34px}
</style>
</head>
<body>
<div class="top"><div class="topin" id="topNav"><a href="sec-index.html">🏠</a></div></div>
<header>
<h1>اختبارات CompTIA Security+ SY0-701</h1>
<p>كل درس يغطي جميع أقسامه — الأسئلة بالإنجليزي والشرح بالعربي</p>
</header>
<main class="wrap">
<section id="menu">
<div class="notice">تم تنظيم بنك الأسئلة حسب <b>كل قسم داخل كل درس</b>، وليس فقط حسب رقم الدرس. يظهر عدد الأقسام والأسئلة على كل بطاقة.</div>
<div class="grid" id="lessonGrid"></div>
</section>

<section id="quiz">
<div class="quizhead"><span id="counter"></span><span id="liveScore"></span></div>
<div class="bar"><i id="progress"></i></div>
<div class="qbox">
<span class="qtag" id="qtag"></span>
<div class="qtext" id="qtext"></div>
<div class="opts" id="opts"></div>
<div class="feedback" id="feedback"></div>
<div class="actions">
<button class="btn secondary" id="menuBtn">← قائمة الاختبارات</button>
<button class="btn primary" id="nextBtn" disabled>السؤال التالي ←</button>
</div>
</div>
</section>

<section id="result">
<div class="score" id="scoreText"></div>
<h2>انتهى الاختبار</h2>
<p class="muted" id="resultLine"></p>
<div class="actions" style="justify-content:center;margin-top:18px">
<button class="btn primary" id="restartBtn">إعادة الاختبار</button>
<button class="btn secondary" id="resultMenuBtn">قائمة الدروس</button>
<a class="btn secondary" id="lessonBackBtn" href="sec-index.html">العودة للشرح</a>
</div>
<div class="review" id="review"></div>
</section>
<footer>© Lujain Alshamrani · CompTIA Security+ SY0-701 Study Site</footer>
</main>
<script src="sec-quiz-data.js"></script>
<script>
const menu=document.getElementById('menu'),quiz=document.getElementById('quiz'),result=document.getElementById('result');
const grid=document.getElementById('lessonGrid'),topNav=document.getElementById('topNav');
const counter=document.getElementById('counter'),liveScore=document.getElementById('liveScore'),progress=document.getElementById('progress');
const qtag=document.getElementById('qtag'),qtext=document.getElementById('qtext'),opts=document.getElementById('opts'),feedback=document.getElementById('feedback');
const nextBtn=document.getElementById('nextBtn'),menuBtn=document.getElementById('menuBtn');
let mode=null,items=[],idx=0,score=0,answers=[];

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function getLessonQs(n){return SEC_QUESTIONS.filter(x=>x.l===n)}
function sectionCount(qs){return new Set(qs.map(x=>x.s)).size}
function show(el){[menu,quiz,result].forEach(x=>x.style.display='none');el.style.display='block';window.scrollTo({top:0,behavior:'smooth'})}

function buildNav(){
 for(let i=1;i<=16;i++){
  const a=document.createElement('a');a.href=`sec-lesson${i}-guide.html`;a.textContent=i;topNav.appendChild(a)
 }
 const q=document.createElement('a');q.href='sec-quiz.html';q.textContent='📝';q.className='active';topNav.appendChild(q)
}

function buildMenu(){
 grid.innerHTML='';
 for(let i=1;i<=16;i++){
  const qs=getLessonQs(i),d=SEC_LESSONS[i];
  const a=document.createElement('a');a.className='card';a.href=`sec-quiz.html?lesson=${i}`;
  a.innerHTML=`<div class="num">LESSON ${i}</div><h3>${d.ar}</h3><p>${qs.length} سؤال · ${sectionCount(qs)} أقسام مغطاة</p>`;
  grid.appendChild(a)
 }
 const all=document.createElement('a');all.className='card all';all.href='sec-quiz.html?lesson=all';
 all.innerHTML=`<div class="num">FULL PRACTICE</div><h3>اختبار شامل لجميع الدروس</h3><p>${SEC_QUESTIONS.length} سؤال · الدروس 1–16</p>`;grid.appendChild(all)
}

function start(m){
 mode=m;idx=0;score=0;answers=[];
 items=m==='all'?shuffle(SEC_QUESTIONS):shuffle(getLessonQs(Number(m)));
 if(!items.length){show(menu);return}
 show(quiz);renderQ()
}

function renderQ(){
 const x=items[idx];
 counter.textContent=`السؤال ${idx+1} من ${items.length}`;
 liveScore.textContent=`النتيجة: ${score}`;
 progress.style.width=`${(idx/items.length)*100}%`;
 qtag.textContent=`L${x.l} · ${x.s}`;
 qtext.textContent=x.q;opts.innerHTML='';feedback.className='feedback';feedback.innerHTML='';nextBtn.disabled=true;
 x.o.forEach((label,i)=>{
  const b=document.createElement('button');b.className='opt';b.textContent=label;b.onclick=()=>choose(i,b,x);opts.appendChild(b)
 })
}

function choose(i,button,x){
 const buttons=[...opts.querySelectorAll('.opt')];buttons.forEach(b=>b.disabled=true);buttons[x.a].classList.add('correct');
 const ok=i===x.a;if(!ok)button.classList.add('wrong');if(ok)score++;
 answers.push({q:x.q,correct:x.o[x.a],chosen:x.o[i],ok,lesson:x.l,section:x.s});
 liveScore.textContent=`النتيجة: ${score}`;
 feedback.innerHTML=x.e;feedback.classList.add('show');nextBtn.disabled=false
}

function finish(){
 show(result);progress.style.width='100%';const pct=Math.round(score/items.length*100);
 document.getElementById('scoreText').textContent=`${score} / ${items.length} (${pct}%)`;
 document.getElementById('resultLine').textContent=pct>=80?'ممتاز — التغطية قوية. راجعي الأخطاء فقط.':pct>=65?'جيد — راجعي الأقسام التي أخطأتِ فيها قبل الانتقال.':'تحتاج مراجعة أعمق للأقسام الضعيفة قبل الاختبار التالي.';
 const back=document.getElementById('lessonBackBtn');back.style.display=mode==='all'?'none':'inline-block';if(mode!=='all')back.href=`sec-lesson${mode}-guide.html`;
 const review=document.getElementById('review');review.innerHTML='<h3>مراجعة الإجابات</h3>';
 answers.forEach((a,n)=>{const d=document.createElement('div');d.className=`rv ${a.ok?'hit':'miss'}`;d.innerHTML=`<b>${a.ok?'✓':'✕'} L${a.lesson} · ${a.section}</b><span class="rvq">${n+1}. ${a.q}</span><span class="rva">Correct: ${a.correct}${a.ok?'':` · Your answer: ${a.chosen}`}</span>`;review.appendChild(d)})
}

nextBtn.onclick=()=>{idx++;idx>=items.length?finish():renderQ()};
menuBtn.onclick=()=>{history.replaceState(null,'','sec-quiz.html');show(menu)};
document.getElementById('resultMenuBtn').onclick=()=>{history.replaceState(null,'','sec-quiz.html');show(menu)};
document.getElementById('restartBtn').onclick=()=>start(mode);

buildNav();buildMenu();
const p=new URLSearchParams(location.search).get('lesson');
if(p==='all'||(Number(p)>=1&&Number(p)<=16))start(p);else show(menu);
</script>
</body>
</html>
